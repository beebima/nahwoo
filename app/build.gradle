plugins { id 'com.android.application' }

android {
    namespace 'id.sejutasantri.nahwoo'
    compileSdk 35

    defaultConfig {
        applicationId 'id.sejutasantri.nahwoo'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '0.1.7'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
