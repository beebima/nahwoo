.nw-eval-focus span{border-radius:11px;background:rgba(36,93,209,.09);padding:4px 9px}
.nw-eval-question h3{font-size:calc(var(--latin-size) * 1.05);line-height:1.75}
.nw-eval-option>span:nth-child(2){flex:1;min-width:0;line-height:1.6;font-size:var(--latin-size)}
.nw-guided-hints{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:12px;margin:14px 0 0}
.nw-guided-head{font-weight:800;color:var(--ink);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between}
.nw-guided-head small{color:var(--muted);font-size:11px;font-weight:500}
.nw-hint-btn{display:block;width:100%;margin-top:11px;border:1px solid var(--blue);background:var(--surface);color:var(--blue);padding:12px;border-radius:11px;text-align:center;font-weight:750;cursor:pointer}
.nw-hint-text{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px}
.nw-hint-text b{font-size:13px;color:var(--blue)}
.nw-hint-text p{font-size:var(--latin-size);line-height:1.8;color:var(--ink);margin:6px 0 0}
.nw-eval-review .nw-eval-arab-lines{font-size:calc(var(--arabic-size) * .78);line-height:1.8}
.nw-eval-review .nw-eval-focus{font-size:calc(var(--arabic-size) * .60)}
.nw-eval-review .nw-eval-arab-wrap{margin:8px 0}
.nw-eval-review p{overflow-wrap:anywhere}
.nw-eval-review .nw-eval-why{font-size:var(--latin-size);line-height:1.75}
.nw-hint-count{font-size:12px;margin-top:6px;opacity:.85}
.nw-load-error{color:#b45309}
.dark .nw-guided-hints,.dark .nw-eval-arab-wrap{background:#17253d}
.dark .nw-hint-btn{color:#a8c6ff;border-color:#669aff}
.dark .nw-hint-text b{color:#a8c6ff}


/* NAHWOO V0.1.8.4: semantic typography, independent reader controls */
:root{--heading-size:28px;--subheading-size:21px;--quote-size:23px}
.content .nw-main-heading{font-size:var(--heading-size)!important;line-height:1.32;font-weight:850;letter-spacing:-.02em;overflow-wrap:anywhere;margin:7px 0 15px}
.nw-reader.nw-reader-v3 .nw-hook h2,.nw-reader.nw-reader-v3 .nw-story h2,.nw-reader.nw-reader-v3 h3,.nw-reader.nw-reader-v3 .nw-card-title{font-size:var(--subheading-size)!important;line-height:1.42;overflow-wrap:anywhere}
.nw-reader.nw-reader-v3 .nw-card-title{font-weight:820}
.nw-reader .nw-quote{margin:7px 0 17px;padding:18px 17px 18px 19px;border-radius:15px;border-left:5px solid var(--blue);background:var(--soft);box-shadow:0 3px 12px rgba(36,93,209,.04)}
.nw-reader .nw-quote .nw-quote-text{font-size:var(--quote-size)!important;line-height:1.52;font-weight:820;letter-spacing:-.018em;margin:0;color:var(--ink);overflow-wrap:anywhere}
.nw-reader .nw-quote .nw-quote-attribution{font-size:calc(var(--latin-size) * .86)!important;font-weight:600;color:var(--muted);margin:10px 0 0}
.nw-reader .nw-quote .nw-arab-inline{font-size:calc(var(--arabic-size) * .70);line-height:1.7}
.nw-reader .nw-body-block{margin:7px 0 13px}
.nw-reader .nw-subheading-block{font-size:var(--subheading-size)!important;line-height:1.45;margin:12px 0 6px;color:var(--blue)}
.nw-type-preview{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:17px;color:var(--ink)}
.nw-type-preview .nw-preview-kicker{font-size:var(--sys-size);font-weight:750;color:var(--blue);margin:0 0 11px}
.nw-type-preview .nw-preview-main{font-size:var(--heading-size)!important;font-weight:850;line-height:1.28;color:var(--ink);margin:0 0 9px;overflow-wrap:anywhere}
.nw-type-preview .nw-preview-sub{font-size:var(--subheading-size)!important;font-weight:800;line-height:1.4;color:var(--blue);margin:10px 0 8px}
.nw-type-preview .nw-preview-body{font-size:var(--latin-size)!important;line-height:1.72;color:var(--ink);margin:7px 0}
.nw-type-preview .nw-preview-ar{font-size:var(--arabic-size)!important;font-family:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;line-height:1.9;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
.nw-type-preview .nw-preview-quote{font-size:var(--quote-size)!important;line-height:1.54;font-weight:850;color:var(--ink);border-left:5px solid var(--blue);border-radius:10px;background:var(--soft);padding:12px 13px;margin:14px 0 6px;overflow-wrap:anywhere}
.nw-type-preview .nw-preview-foot{font-size:12px;color:var(--muted);line-height:1.5;margin:12px 0 0}
.nw-font-divider{height:1px;background:var(--line);margin:17px 0 13px}
@media(max-width:350px){.nw-type-preview{padding:12px}.nw-reader .nw-quote{padding:14px 12px}}

/* V0.1.8.6 — Mini Dictionary: home shortcut only, lower settings nav unchanged */
.nw-dict-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.nw-dict-header h1{font-size:var(--heading-size,28px);margin:4px 0 5px;line-height:1.23}
.nw-dict-header p{margin:0}
.nw-dict-icon{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:15px;background:var(--soft);color:var(--blue);flex:none}
.nw-dict-icon svg{width:29px;height:29px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nw-dict-search{display:flex;align-items:center;gap:9px;border:2px solid var(--line);border-radius:15px;background:var(--surface);padding:4px 10px;margin:0 0 8px;transition:border-color .2s}
.nw-dict-search:focus-within{border-color:var(--blue)}
.nw-dict-search .search{border:0!important;background:transparent!important;margin:0;outline:none;padding:11px 2px;flex:1;min-width:0;color:var(--ink);font-size:var(--sys-size,16px)}
.nw-dict-search-icon{display:flex;color:var(--muted)}
.nw-dict-search-icon svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nw-dict-clear{border:0;background:var(--soft);border-radius:50%;width:28px;height:28px;line-height:27px;color:var(--ink);cursor:pointer;font-size:20px;flex:none}
.nw-dict-help{display:flex;flex-wrap:wrap;gap:6px 9px;color:var(--muted);font-size:11px;margin-bottom:11px}
.nw-dict-help span{padding:6px 8px;border-radius:7px;background:var(--soft)}
.nw-dict-result-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:15px 0 4px;font-size:var(--sys-size,16px)}
.nw-dict-guidance{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 14px}
.nw-dict-card{background:var(--surface);border:1px solid var(--line);padding:16px;border-radius:17px;margin:0 0 11px;box-shadow:0 2px 8px rgba(25,67,140,.025)}
.nw-dict-card-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.nw-dict-card-meta{min-width:0;flex:1}
.nw-dict-arabic{font-size:clamp(25px,calc(var(--arabic-size,45px) * .77),46px);font-family:'Noto Naskh Arabic','Traditional Arabic','Amiri',serif;line-height:1.8;color:var(--ink);overflow-wrap:anywhere;text-align:right}
.nw-dict-kind{display:inline-block;font-size:11px;color:var(--blue);background:var(--soft);padding:5px 9px;border-radius:50px;font-weight:700}
.nw-dict-bookmark{background:var(--soft);border:0;border-radius:12px;color:var(--blue);font-size:25px;width:42px;height:42px;cursor:pointer;flex:none}
.nw-dict-meaning{font-size:calc(var(--latin-size,16px) * 1.06);font-weight:800;margin:9px 0 11px;line-height:1.42;color:var(--ink)}
.nw-dict-example{border-top:1px dashed var(--line);padding-top:11px;margin-top:4px}
.nw-dict-example-label{display:block;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.07em}
.nw-dict-example-ar{font-family:'Noto Naskh Arabic','Traditional Arabic','Amiri',serif;font-size:clamp(22px,calc(var(--arabic-size,45px) * .62),38px);text-align:right;line-height:1.8;padding:4px 0;color:var(--ink);overflow-wrap:anywhere}
.nw-dict-example p{font-size:calc(var(--latin-size,16px) * .88);color:var(--muted);margin:1px 0 0;line-height:1.65}
.nw-dict-feedback{text-align:center;padding:30px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:15px;color:var(--muted);display:flex;flex-direction:column;gap:9px;align-items:center}
.nw-dict-feedback svg{width:35px;height:35px;stroke:var(--blue);fill:none;stroke-width:1.7}
.nw-dict-feedback b{color:var(--ink)}
.nw-dict-feedback p{margin:0}
@media(max-width:365px){.nw-dict-header{gap:10px}.nw-dict-icon{width:43px;height:43px}.nw-dict-icon svg{width:24px;height:24px}.nw-dict-card{padding:13px}}

/* V0.1.8.7 — DRAFT_REVIEW visible to learners */
.nw-dict-draft-badge{display:inline-block;margin:6px 0 7px;padding:4px 9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:11px;font-weight:650;color:var(--muted)}


/* NAHWOO editorial reader: only semantic highlights get colorful cards. */
.nwx-reader{display:flex;flex-direction:column;gap:13px;min-width:0}
.nwx-reader .nwx-flow{min-width:0;margin:0 0 3px}
.nwx-reader .nwx-flow>.nw-subheading-block{color:var(--blue)!important;margin:15px 0 9px!important;line-height:1.42;font-weight:800}
.nwx-reader .nwx-flow:first-child>.nw-subheading-block{margin-top:3px!important}
.nwx-reader .nw-body-block{margin:0 0 11px!important}
.nwx-reader .nw-body-block:last-child{margin-bottom:0!important}
.nwx-reader .nw-body-block p{font-size:var(--latin-size)!important;line-height:1.68!important;margin:0!important;color:var(--ink);overflow-wrap:break-word}
.nwx-reader .nw-arab-inline{display:inline!important;vertical-align:baseline!important;font-size:1.12em!important;line-height:1.35!important;letter-spacing:0!important;white-space:normal;color:inherit}
.nwx-reader .nw-arab-stage{font-size:var(--arabic-size)!important;line-height:1.88!important;margin:12px 0!important;padding:13px 10px!important;background:color-mix(in srgb,var(--surface) 70%,#dce7ff);border-radius:14px}
.nwx-reader .nw-quote{margin:12px 0 2px!important}
.nwx-reader .nw-quote .nw-quote-text{line-height:1.48!important}
.nwx-reader .nwx-card{--nwx-accent:#245dd1;background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:15px 14px;margin:0;min-width:0;overflow-wrap:break-word;box-shadow:0 3px 12px rgba(25,55,105,.04)}
.nwx-reader .nwx-card-head{display:flex;align-items:center;gap:9px;margin:0 0 13px;min-width:0}
.nwx-reader .nwx-card-head .nw-subheading-block{color:var(--nwx-accent)!important;font-size:var(--subheading-size)!important;line-height:1.38!important;margin:0!important;font-weight:800}
.nwx-reader .nwx-card-icon{display:inline-grid;place-items:center;flex:0 0 32px;width:32px;height:32px;border-radius:10px;font-weight:800;font-size:20px;color:var(--nwx-accent);background:color-mix(in srgb,var(--surface) 50%,var(--nwx-accent) 15%);line-height:1}
.nwx-reader .nwx-target{--nwx-accent:#95620f;background:color-mix(in srgb,var(--surface) 26%,#fff2cd);border-color:#e8ce88}
.nwx-reader .nwx-target-list{display:grid;gap:12px}
.nwx-reader .nwx-target-item{display:flex;gap:9px;align-items:flex-start;color:var(--ink);font-size:var(--latin-size)!important;line-height:1.6}
.nwx-reader .nwx-check{display:inline-grid;place-items:center;flex:0 0 18px;width:18px;height:18px;border-radius:99px;font-size:12px;font-weight:900;color:#a36c19;background:color-mix(in srgb,var(--surface) 35%,#ecc275);margin-top:3px}
.nwx-reader .nwx-example{--nwx-accent:#245dd1;background:color-mix(in srgb,var(--surface) 34%,#e8f0ff);border-color:#c9d9f4}
.nwx-reader .nwx-example .nw-arab-stage{background:color-mix(in srgb,var(--surface) 72%,#dce6ff)}
.nwx-reader .nwx-example .nw-body-block p{text-align:center}
.nwx-reader .nwx-breakdown{--nwx-accent:#277453;background:color-mix(in srgb,var(--surface) 37%,#e3f6e9);border-color:#baddc7}
.nwx-reader .nwx-word-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nwx-reader .nwx-word-tile{min-width:0;padding:10px 7px;background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 65%,#b3d6c1);border-radius:12px;text-align:center}
.nwx-reader .nwx-word-ar{font-family:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;font-size:clamp(21px,calc(var(--arabic-size) * .59),32px);line-height:1.8;overflow-wrap:normal;word-break:normal;color:var(--ink)}
.nwx-reader .nwx-word-desc{font-size:calc(var(--latin-size) * .79);line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.nwx-reader .nwx-word-desc .nw-arab-inline{font-size:1em!important}
.nwx-reader .nwx-compare{--nwx-accent:#7152ae;background:color-mix(in srgb,var(--surface) 42%,#f0eaff);border-color:#d7c9ed}
.nwx-reader .nwx-practice{--nwx-accent:#7152ae;background:color-mix(in srgb,var(--surface) 53%,#efeaff);border-color:#ded3f0}
.nwx-reader .nwx-warning{--nwx-accent:#ad5347;background:color-mix(in srgb,var(--surface) 42%,#ffebe5);border-color:#efc9bf}
.nwx-reader .nwx-flow-check>.nw-subheading-block{color:#7152ae!important}
.nwx-reader .nwx-card .nw-body-block p{color:var(--ink)}
.nwx-reader .nw-card,.nwx-reader .nw-target{margin:8px 0!important}
.dark .nwx-reader .nwx-target{--nwx-accent:#f0c56b;background:color-mix(in srgb,var(--surface) 90%,#9a6f1b);border-color:#665331}
.dark .nwx-reader .nwx-example{--nwx-accent:#a4c0ff;background:color-mix(in srgb,var(--surface) 91%,#245dd1);border-color:#344d77}
.dark .nwx-reader .nwx-breakdown{--nwx-accent:#8ed9b3;background:color-mix(in srgb,var(--surface) 91%,#147b4c);border-color:#355e4a}
.dark .nwx-reader .nwx-compare,.dark .nwx-reader .nwx-practice{--nwx-accent:#c6adf3;background:color-mix(in srgb,var(--surface) 91%,#7152ae);border-color:#53446c}
.dark .nwx-reader .nwx-warning{--nwx-accent:#f2a69e;background:color-mix(in srgb,var(--surface) 91%,#ad5347);border-color:#6a4745}

function closestSuggestion(q,candidates){const needle=normalize(q);if(!needle)return '';let best='',bestScore=999;for(const item of candidates){for(const part of [item,...normalize(item).split(' ')]){let t=normalize(part);if(!t)continue;let d=distance(needle,t);if(d<bestScore){bestScore=d;best=item}}}return bestScore<=Math.max(2,Math.floor(needle.length*.45))?best:''}
function suggestionMarkup(q,candidates,field){if(!q.trim())return '';let match=closestSuggestion(q,candidates);if(!match||normalize(match)===normalize(q))return '';return `<div class="suggest">Mungkin maksudmu <button onclick="applySuggestion('${field}',${JSON.stringify(match).replace(/'/g,'&#39;')})">${safe(match)}</button>?</div>`}

}

 const s=document.createElement('script');s.src=path;s.async=true;s.onload=()=>{s.remove();done()};s.onerror=()=>{s.remove();fail()};document.head.appendChild(s);
}
function nwEnsureLevelLoaded(n){
 if(nwLevelAvailable(n))return;
 if(nwLoadPending[n])return;
 nwLoadPending[n]='loading';
 nwAssetLoad(`content/level_${String(n).padStart(2,'0')}_public.js`,()=>{nwLoadPending[n]='ready';if(view==='reader'&&level===n)render()},()=>{nwLoadPending[n]='failed';const el=document.getElementById('nw-reader-load');if(el)el.innerHTML='<p class="nw-load-error">Materi gagal dimuat dari paket aplikasi. Coba buka kembali sublevel ini.</p><button class="btn" onclick="delete nwLoadPending[level];nwEnsureLevelLoaded(level)">Coba lagi</button>';});
}
function nwEnsureKeysLoaded(n){
 if(window.NW_PRIVATE_KEYS[n]){nwEvalDraw();return}
 if(nwKeysPending[n])return;
 nwKeysPending[n]='loading';
 nwAssetLoad(`content/level_${String(n).padStart(2,'0')}_keys.js`,()=>{nwKeysPending[n]='ready';if(view==='reader'&&level===n)nwEvalDraw()},()=>{nwKeysPending[n]=null;const el=document.getElementById('nw-eval-root');if(el)el.innerHTML='<div class="nw-card"><b>Pembahasan belum berhasil dimuat.</b><p>Jawabanmu telah tersimpan. Ketuk untuk mencoba memuat pembahasan lagi.</p><button class="nw-eval-btn" onclick="nwEnsureKeysLoaded(level)">Muat pembahasan</button></div>';});
}
function nwEscape(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
/* EYD V §21: capitalize title words; noninitial kata tugas stay lowercase.
   Applied only on presentation, keeping source lessons, quotes and notes untouched. */
const NW_ID_TITLE_PARTICLES=new Set([
 'di','ke','dari','dan','yang','untuk','atau','pada','dalam','dengan','sebagai',
 'antara','terhadap','kepada','oleh','tentang','bagi','demi','tanpa','melalui',
 'lewat','menurut','sejak','hingga','sampai','sebelum','setelah','ketika','saat',
 'jika','bila','kalau','agar','supaya','karena','sebab','tetapi','namun',
 'sedangkan','sementara','serta','maupun','meskipun','walaupun','meski','walau',
 'sambil','bahwa','yakni','yaitu','daripada','secara','si','sang','para','pun'
]);
function nwTitleCaseId(value){
 const text=String(value??'');
 let n=0;
 return text.replace(/[\p{L}\p{M}]+(?:['’‘][\p{L}\p{M}]+)*/gu,word=>{
   const isFirst=n++===0,lower=word.toLocaleLowerCase('id-ID');
   if(!isFirst&&NW_ID_TITLE_PARTICLES.has(lower))return lower;
   // Preserve uppercase acronyms and existing proper-name internal capitalization.
   if(word.length>1&&word===word.toUpperCase()&&word!==word.toLowerCase())return word;
   return word.slice(0,1).toLocaleUpperCase('id-ID')+word.slice(1);
 });
}

function nwTextMixed(text){
 const v=String(text??'');const rx=/([\p{Script=Arabic}\p{Mark}]+(?:[ \t]+[\p{Script=Arabic}\p{Mark}]+)*)/gu;
 let result='',start=0;for(const m of v.matchAll(rx)){result+=nwEscape(v.slice(start,m.index));result+=`<span class="nw-arab-inline" lang="ar" dir="rtl">${nwEscape(m[0])}</span>`;start=m.index+m[0].length;}return result+nwEscape(v.slice(start));
}
function nwSegments(segs){
 if(typeof segs==='string')return nwTextMixed(segs);
 if(!Array.isArray(segs))return '';
 return segs.map(seg=>{
  let s=nwTextMixed(seg.text??'');const marks=Array.isArray(seg.marks)?seg.marks:[];
  if(marks.includes('bold'))s=`<strong>${s}</strong>`;
  if(marks.includes('italic'))s=`<em>${s}</em>`;
  return s;
 }).join('');
}
function nwPara(segs){return `<p>${nwSegments(segs)}</p>`;}
function nwReaderHeadingText(n,i,fallback){const b=nwGetLesson(n,i)?.blocks?.find(b=>b.type==='MAIN_HEADING');const raw=b?(b.text||((b.segments||[]).map(x=>x.text||'').join(''))||fallback):(nwGetLesson(n,i)?.title||fallback);return nwEscape(nwTitleCaseId(raw));}
function nwBlockMarkup(block){
 const type=block.type||'';const title=nwEscape(nwTitleCaseId(block.heading||''));const body=nwPara(block.segments);
  if(type==='MAIN_HEADING')return ''; /* main heading rendered once in reader header */
  if(type==='SUBHEADING')return `<h2 class="nw-subheading-block">${nwTextMixed(nwTitleCaseId(Array.isArray(block.segments)?block.segments.map(x=>x.text||'').join(''):(block.text||block.heading||'')))}</h2>`;
  if(type==='BODY')return `<section class="nw-body-block">${body}</section>`;
  if(type==='ARABIC_TEXT')return `<div class="nw-arab-stage" lang="ar" dir="rtl">${nwEscape(block.arabic||block.text||'')}</div>`;
  if(type==='QUOTE')return `<blockquote class="nw-quote"><p class="nw-quote-text">${nwSegments(block.segments||block.text||'')}</p>${block.attribution?`<p class="nw-quote-attribution">${nwEscape(block.attribution)}</p>`:''}</blockquote>`;
 if(type==='TARGET')return `<div class="nw-target"><div class="nw-card-title">🎯 ${title||'Target belajar'}</div>${body}</div>`;
 if(type==='HOOK')return `<section class="nw-hook"><h2>${title||'Mari mulai'}</h2>${body}</section>`;
 if(type==='ARABIC_EXAMPLE')return `<section class="nw-card nw-example"><div class="nw-card-title">✦ ${title||'Perhatikan contoh'}</div><div class="nw-arab-stage" dir="rtl" lang="ar">${nwEscape(block.arabic||'')}</div>${block.translation?`<p class="nw-translation">${nwTextMixed(block.translation)}</p>`:''}</section>`;
 if(type==='WORD_BREAKDOWN')return `<section class="nw-card nw-breakdown"><h3>🔎 ${title||'Bedah kata'}</h3><p class="nw-small">Kenali makna dan peran setiap bagian.</p><div class="nw-words">${(block.rows||[]).map(w=>`<div class="nw-word-row"><div class="nw-word-ar" dir="rtl" lang="ar">${nwEscape(w.arabic||'')}</div><div class="nw-word-desc"><strong>${nwTextMixed(w.meaning||'')}</strong><small>${nwTextMixed(w.role||'')}</small></div></div>`).join('')}</div></section>`;
 if(['CONCEPT','CONCEPT_1','CONCEPT_2'].includes(type))return `<section class="nw-story"><h2>${title||'Memahami polanya'}</h2>${body}</section>`;
 if(type==='COMPARISON')return `<section class="nw-card nw-detail"><div class="nw-card-title">⚖️ ${title||'Bandingkan'}</div>${block.arabic_lines?.length?`<div class="nw-compare-arab" lang="ar" dir="rtl">${block.arabic_lines.map(line=>`<div>${nwEscape(line)}</div>`).join('')}</div>`:''}${body}</section>`;
 if(type==='INSIGHT')return `<section class="nw-card nw-insight"><div class="nw-card-title">💡 ${title||'Momen Aha!'}</div>${body}</section>`;
 if(type==='PRACTICE')return `<details class="nw-card nw-practice"><summary>📖 ${title||'Cara berlatih'}</summary>${body}</details>`;
 if(type==='QUICK_CHECK')return `<section class="nw-card nw-quiz"><div class="nw-card-title">🧠 ${title||'Cek pemahaman kecil'}</div><p class="nw-small">Coba jawab sendiri dulu. Latihan ini tidak termasuk 20 soal evaluasi akhir.</p><p class="nw-question">${nwSegments(block.segments||block.prompt||'')}</p>${block.feedback?`<details class="nw-check-feedback"><summary>Lihat umpan balik setelah mencoba</summary><div class="nw-answer">${nwTextMixed(block.feedback)}</div></details>`:''}</section>`;
 if(type==='WARNING')return `<section class="nw-card nw-warning"><div class="nw-card-title">⚠️ ${title||'Jangan terjebak'}</div>${body}</section>`;
 if(type==='TAKEAWAY')return `<section class="nw-card nw-takeaway"><div class="nw-card-title">⭐ ${title||'Pegangan hari ini'}</div>${body}</section>`;
 if(type==='NEXT_STEP')return `<section class="nw-next"><div class="nw-card-title">→ ${title||'Berikutnya'}</div>${body}</section>`;
 return '';
}
function nwGetLesson(n,i){return (window.NW_LEVEL_DATA[n]?.materials||[]).find(x=>x.sublevel_id===`L${n}-S${String(i+1).padStart(2,'0')}`);}
function nwGetEvaluation(n,i){return (window.NW_LEVEL_DATA[n]?.evaluations||[]).find(x=>x.sublevel_id===`L${n}-S${String(i+1).padStart(2,'0')}`);}
function nwGetKey(n,i){const ev=nwGetEvaluation(n,i);return (window.NW_PRIVATE_KEYS[n]?.answer_keys||[]).find(x=>x.evaluation_id===ev?.evaluation_id);}

/* Central design system for all 240 sublevel lessons. */
function nwSectionHeading(b){return b?nwTextMixed(nwTitleCaseId(Array.isArray(b.segments)?b.segments.map(x=>x.text||'').join(''):(b.text||b.heading||''))):'';}
function nwSemanticSectionMarkup(section,index){
 const title=nwSectionHeading(section.heading);
 const heading=title?'<h2 class="nw-subheading-block">'+title+'</h2>':'';
 const blocks=section.blocks;
 const content=blocks.map(nwBlockMarkup).join('');
 const layouts={1:'target',2:'example',3:'breakdown',6:'compare',8:'practice',10:'warning'};
 const kind=layouts[index]||'flow';
 if(kind==='target'){
   const checks=blocks.filter(b=>b.type==='BODY');
   const others=blocks.filter(b=>b.type!=='BODY');
   const list=checks.map(b=>{
     const segs=Array.isArray(b.segments)?b.segments.map((seg,i)=>({...seg,text:i===0?String(seg.text||'').replace(/^\s*[•●\-–]\s*/,''):seg.text})):b.segments;
     return '<div class="nwx-target-item"><span class="nwx-check" aria-hidden="true">✓</span><div>'+nwSegments(segs)+'</div></div>';
   }).join('');
   return '<section class="nwx-card nwx-target"><div class="nwx-card-head"><span class="nwx-card-icon" aria-hidden="true">◎</span>'+heading+'</div><div class="nwx-target-list">'+list+'</div>'+others.map(nwBlockMarkup).join('')+'</section>';
 }
 if(kind==='breakdown'){
   const pairs=[];let paired=blocks.length>=4;
   if(paired)for(let j=0;j<blocks.length;j+=2){
     if(blocks[j]?.type!=='ARABIC_TEXT'||blocks[j+1]?.type!=='BODY'){paired=false;break;}
     pairs.push([blocks[j],blocks[j+1]]);
   }
   const grid=paired?'<div class="nwx-word-grid">'+pairs.map(([ar,desc])=>
     '<div class="nwx-word-tile"><div class="nwx-word-ar" lang="ar" dir="rtl">'+nwEscape(ar.arabic||ar.text||'')+
     '</div><div class="nwx-word-desc">'+nwSegments(desc.segments||'')+'</div></div>').join('')+'</div>':content;
   return '<section class="nwx-card nwx-breakdown"><div class="nwx-card-head"><span class="nwx-card-icon" aria-hidden="true">⌕</span>'+heading+'</div>'+grid+'</section>';
 }
 if(kind!=='flow'){
   const icons={example:'✦',compare:'⇄',practice:'✎',warning:'!'};
   return '<section class="nwx-card nwx-'+kind+'"><div class="nwx-card-head"><span class="nwx-card-icon" aria-hidden="true">'+icons[kind]+'</span>'+heading+'</div><div class="nwx-card-content">'+content+'</div></section>';
 }
 return '<section class="nwx-flow '+(index===9?'nwx-flow-check':'')+'">'+heading+content+'</section>';
}
function nahwooLessonMarkup(n,i){
 if(!nwLevelAvailable(n))return '<section class="nw-card" id="nw-reader-load"><div class="nw-card-title">📚 Memuat materi Level '+n+'…</div><p>Menyiapkan materi dan latihan dari paket offline.</p></section>';
 const lesson=nwGetLesson(n,i);if(!lesson)return '<div class="nw-card"><p>Sublevel tidak ditemukan di paket materi.</p></div>';
 const blocks=lesson.blocks||[];
 const priority=['TARGET','HOOK'];
 const ordered=[...priority.flatMap(k=>blocks.filter(b=>b.type===k)),...blocks.filter(b=>!priority.includes(b.type))];
 const sections=[];let current=null;
 for(const block of ordered){
   if(block.type==='MAIN_HEADING')continue;
   if(block.type==='SUBHEADING'){
     if(current)sections.push(current);
     current={heading:block,blocks:[]};
   }else{
     if(!current)current={heading:null,blocks:[]};
     current.blocks.push(block);
   }
 }
 if(current)sections.push(current);
 const complete13=sections.length===13&&sections.every(s=>!!s.heading);
 return '<div class="nw-reader nw-reader-v3 nw-reader-cards nwx-reader">'+sections.map((section,j)=>nwSemanticSectionMarkup(section,complete13?j:-1)).join('')+'</div>';
}

let nwEvalIndex=0, nwEvalAnswers={}, nwEvalSubmitted=false, nwEvalConfirm=false, nwEvalHintLevels={},nwEvalActiveKey='';
function nwEvalKey(){return `nahwoo_eval_v0185_L${level}_S${String(sub+1).padStart(2,'0')}`;}
function nwEvalLoad(){
 const k=nwEvalKey();if(nwEvalActiveKey===k)return;
 nwEvalActiveKey=k;nwEvalIndex=0;nwEvalConfirm=false;
 try {const value=JSON.parse(localStorage.getItem(k)||'{}');nwEvalAnswers=(value.answers&&typeof value.answers==='object')?value.answers:{};nwEvalSubmitted=!!value.submitted;nwEvalHintLevels=(value.hints&&typeof value.hints==='object')?value.hints:{};}catch(e){nwEvalAnswers={};nwEvalSubmitted=false;nwEvalHintLevels={};}
}
function nwEvalSave(){try{localStorage.setItem(nwEvalKey(),JSON.stringify({answers:nwEvalAnswers,submitted:nwEvalSubmitted,hints:nwEvalHintLevels}));}catch(e){}}
function nwEvalSelect(i){if(nwEvalSubmitted||!(i>=0&&i<6))return;nwEvalAnswers[nwEvalIndex]=i;nwEvalConfirm=false;nwEvalSave();nwEvalDraw();}
function nwEvalGo(i){if(i<0||i>=20)return;nwEvalIndex=i;nwEvalConfirm=false;nwEvalDraw();}
function nwEvalHint(n){if(nwEvalSubmitted||!(n===1||n===2))return;nwEvalHintLevels[nwEvalIndex]=Math.max(nwEvalHintLevels[nwEvalIndex]||0,n);nwEvalSave();nwEvalDraw();}
function nwEvalSubmit(){if(nwEvalSubmitted||Array.from({length:20},(_,i)=>i).some(i=>!Number.isInteger(nwEvalAnswers[i])))return;nwEvalSubmitted=true;nwEvalConfirm=false;nwEvalSave();nwEvalDraw();}
function nwEvalReset(){if(!confirm('Mulai sesi baru? Jawaban dan nilai sesi sebelumnya akan diganti di perangkat ini.'))return;nwEvalAnswers={};nwEvalSubmitted=false;nwEvalIndex=0;nwEvalHintLevels={};nwEvalSave();nwEvalDraw();}
function nwEvalButtons(q){return q.options.map((opt,i)=>`<button class="nw-eval-option ${nwEvalAnswers[nwEvalIndex]===i?'selected':''}" aria-pressed="${nwEvalAnswers[nwEvalIndex]===i}" onclick="nwEvalSelect(${i})"><span class="nw-eval-letter">${nwEscape(opt.label||String.fromCharCode(65+i))}</span><span>${nwSegments(opt.segments)}</span><span class="nw-eval-radio">${nwEvalAnswers[nwEvalIndex]===i?'●':'○'}</span></button>`).join('');}
function nwEvalDraw(){
 const root=document.getElementById('nw-eval-root');if(!root)return;
 const ev=nwGetEvaluation(level,sub);if(!ev||ev.questions?.length!==20){root.innerHTML='<p class="nw-eval-note">Evaluasi belum tersedia untuk sublevel ini.</p>';return;}
 const bank=ev.questions,answered=Array.from({length:20},(_,i)=>i).filter(i=>Number.isInteger(nwEvalAnswers[i])&&nwEvalAnswers[i]>=0&&nwEvalAnswers[i]<=5).length;
 let out=`<div class="nw-eval-head"><span class="tag">EVALUASI AKHIR SUBLEVEL</span><h2>Uji Pemahaman · 20 Soal</h2><p>Enam opsi A–F, dua petunjuk opsional. <b>Nilai, kunci, dan pembahasan baru ditampilkan setelah semua jawaban dikirim.</b></p><div class="nw-eval-progress"><div style="width:${answered*5}%"></div></div><b>${answered}/20 terjawab</b></div>`;
 if(nwEvalSubmitted){
  const keys=nwGetKey(level,sub);if(!keys){root.innerHTML=out+'<div class="nw-card"><b>Jawabanmu sudah terkirim dan dikunci.</b><p>Memuat nilai dan pembahasan…</p></div>';nwEnsureKeysLoaded(level);return;}
  const keyMap=Object.fromEntries(keys.answers.map(k=>[k.question_id,k]));
  const score=bank.reduce((n,q,i)=>n+(nwEvalAnswers[i]===keyMap[q.id]?.correct_index?1:0),0);
  out+=`<div class="nw-eval-result"><div>HASIL EVALUASI</div><strong>${score*5}<small>/100</small></strong><p>${score} benar · ${20-score} perlu dipelajari</p><div class="nw-hint-count">Petunjuk digunakan pada ${Object.values(nwEvalHintLevels).filter(x=>x>0).length} soal (tidak mengurangi nilai)</div></div><h3>Pembahasan per nomor</h3>`;
  bank.forEach((q,i)=>{const k=keyMap[q.id];if(!k)return;const good=nwEvalAnswers[i]===k.correct_index;let correct=q.options[k.correct_index];let picked=q.options[nwEvalAnswers[i]];out+=`<article class="nw-eval-review"><b>Nomor ${i+1} · <span class="${good?'nw-good':'nw-bad'}">${good?'✓ Benar':'✕ Perlu dipelajari'}</span></b>${nwEvalArabic(q)}<p>${nwSegments(q.stem)}</p><p>Jawabanmu: <b>${nwEscape(picked?.label||'?')}. ${nwSegments(picked?.segments||[])}</b></p><p>Kunci: <b>${nwEscape(correct?.label||'?')}. ${nwSegments(correct?.segments||[])}</b></p><p class="nw-eval-why">${nwTextMixed(k.explanation||'')}</p></article>`});
  out+='<button class="nw-eval-btn nw-eval-outline" onclick="nwEvalReset()">↻ Kerjakan sesi baru</button>';root.innerHTML=out;return;
 }
 const q=bank[nwEvalIndex],openedHints=nwEvalHintLevels[nwEvalIndex]||0;
 out+=`<div class="nw-eval-numbers">${bank.map((_,i)=>`<button type="button" class="${i===nwEvalIndex?'active':''} ${nwEvalAnswers[i]!==undefined?'answered':''}" onclick="nwEvalGo(${i})">${i+1}${nwEvalAnswers[i]!==undefined?' ✓':''}</button>`).join('')}</div>`;
 out+=`<div class="nw-eval-question"><div class="nw-eval-meta">SOAL ${nwEvalIndex+1} DARI 20 · ${nwEscape(q.skill_tag||'Pemahaman')} · ${nwEscape(q.difficulty||'')}</div>${nwEvalArabic(q)}<h3>${nwSegments(q.stem)}</h3><div class="nw-eval-opts">${nwEvalButtons(q)}</div><div class="nw-guided-hints"><div class="nw-guided-head">💡 Butuh bantuan? <small>Opsional, tanpa pengurangan nilai</small></div>${openedHints<1?'<button class="nw-hint-btn" onclick="nwEvalHint(1)">Buka Petunjuk 1 · Cara berpikir</button>':`<div class="nw-hint-text"><b>Petunjuk 1 · Cara berpikir</b><p>${nwTextMixed(q.hint1)}</p></div>${openedHints<2?'<button class="nw-hint-btn" onclick="nwEvalHint(2)">Masih bingung? Buka Petunjuk 2</button>':`<div class="nw-hint-text"><b>Petunjuk 2 · Kosakata atau contoh bantu</b><p>${nwTextMixed(q.hint2)}</p></div>`}`}</div></div>`;
 out+=`<div class="nw-eval-nav"><button class="nw-eval-btn nw-eval-outline" ${nwEvalIndex===0?'disabled':''} onclick="nwEvalGo(${nwEvalIndex-1})">← Sebelumnya</button><button class="nw-eval-btn" ${nwEvalIndex===19?'disabled':''} onclick="nwEvalGo(${nwEvalIndex+1})">Berikutnya →</button></div>`;
 if(answered===20)out+=nwEvalConfirm?'<div class="nw-eval-confirm"><b>Kirim 20 jawaban sekarang?</b><p>Setelah dikirim, jawaban tidak bisa diubah. Nilai, kunci, dan pembahasan akan dibuka.</p><button class="nw-eval-btn nw-eval-outline" onclick="nwEvalConfirm=false;nwEvalDraw()">Periksa lagi</button> <button class="nw-eval-btn" onclick="nwEvalSubmit()">Ya, kirim</button></div>':'<button class="nw-eval-btn nw-eval-submit" onclick="nwEvalConfirm=true;nwEvalDraw()">Kirim 20 Jawaban</button>';
 else out+=`<p class="nw-eval-note">Masih ada ${20-answered} soal. Lengkapi semuanya untuk membuka tombol kirim. Pilihan tersimpan otomatis.</p>`;
 root.innerHTML=out;
}
function nwEvalArabic(q){const lines=(q.arabic_lines||[]).filter(Boolean);const words=(q.focus_words||[]).filter(Boolean);if(!lines.length&&!words.length)return '';return `<div class="nw-eval-arab-wrap"><span class="nw-eval-arab-label">PERHATIKAN TEKS ARAB</span>${lines.length?`<div class="nw-eval-arab-lines" lang="ar" dir="rtl">${lines.map(line=>`<div>${nwEscape(line)}</div>`).join('')}</div>`:''}${words.length?`<div class="nw-eval-focus" lang="ar" dir="rtl">${words.map(w=>`<span>${nwEscape(w)}</span>`).join('')}</div>`:''}</div>`;}
function nwEvalMarkup(){return '<section class="nw-eval" id="nw-eval-root"><p>Menyiapkan 20 soal evaluasi…</p></section>';}

/* Load mufradat on startup; a resumed WebView catches up after screen lock. */
nwMiniEnsureLoaded();
window.setInterval(nwHomeTick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)nwHomeTick()});
window.addEventListener('focus',nwHomeTick);
</script></body></html>
