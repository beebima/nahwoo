function notesItems(){let out=[];for(const k of materialSaved){out.push({type:'materials',key:k,title:lessonTitle(k),body:`Level ${k.split('-')[0]} · Sublevel ${Number(k.split('-')[1])+1}`,search:lessonTitle(k)+' '+(lessonNotes[k]||''),action:`openSavedLesson('${k}')`,remove:`removeSavedItem('materials',${JSON.stringify(k)})`})}for(const [k,v] of Object.entries(lessonNotes)){if(!v.trim())continue;out.push({type:'personal',key:k,title:lessonTitle(k),body:v,search:lessonTitle(k)+' '+v,action:`openSavedLesson('${k}')`,remove:`removeSavedItem('personal',${JSON.stringify(k)})`})}for(const w of words.filter(w=>wordSaved.includes(w.ar))){out.push({type:'words',key:w.ar,title:w.meaning,body:`${w.ar} · ${w.kind} · ${w.example} — ${w.translation}`,search:[w.ar,w.meaning,w.kind,w.example,w.translation].join(' '),action:`openView('mufradat')`,remove:`removeSavedItem('words',${JSON.stringify(w.ar)})`})}for(const t of tipSaved){out.push({type:'tips',key:t,title:'Tips Nahwu',body:t,search:t,action:`setTab('home')`,remove:`removeSavedItem('tips',${JSON.stringify(t)})`})}return out}

function notesResults(){let all=notesItems(),q=noteQuery.trim(),filtered=all.filter(x=>(noteFilter==='all'||x.type===noteFilter)&&(!q||smart(q,x.search)||normalize(x.search).includes(normalize(q))));let suggestions='';if(q&&!filtered.length){const choices=all.filter(x=>noteFilter==='all'||x.type===noteFilter).map(x=>x.title);const near=closestSuggestion(q,choices);if(near)suggestions=`<p class="hint">Mungkin maksudmu: <button class="note-suggestion" onclick="chooseNoteSuggestion(${JSON.stringify(near)})">${safe(near)}</button>?</p>`}const names={materials:'Materi tersimpan',personal:'Catatan pribadi',words:'Mufradat tersimpan',tips:'Tips tersimpan'};return suggestions+(filtered.length?filtered.map(x=>`<div class="card note-result"><div class="note-result-head"><span class="tag">${names[x.type]}</span><button class="note-remove" onclick="${x.remove}" aria-label="Hapus dari catatan">Hapus ×</button></div><h3>${safe(x.title)}</h3><p class="note-body">${safe(x.body)}</p><button class="btn alt full" onclick="${x.action}">${x.type==='personal'?'Buka & edit catatan':x.type==='materials'?'Buka sublevel':x.type==='words'?'Buka Mufradat':'Kembali ke Beranda'} →</button></div>`).join(''):`<div class="card"><p class="muted">${q?'Tidak ada hasil untuk pencarian ini.':'Belum ada koleksi pada kategori ini.'}</p></div>`)}
function chooseNoteSuggestion(q){noteQuery=q;const inp=document.getElementById('notesSearch');if(inp)inp.value=q;const el=document.getElementById('notesResults');if(el)el.innerHTML=notesResults()}
function notesPage(){const counts={materials:materialSaved.length,personal:Object.values(lessonNotes).filter(v=>v.trim()).length,words:wordSaved.length,tips:tipSaved.length};return `<button class="back" onclick="back()">← Kembali</button><h1>${ico('notes','sicon')} Catatan Saya</h1><p class="muted">Ruang belajar pribadi. Koleksi tersimpan di perangkat ini, belum tersinkronisasi Google/Firebase.</p><div class="note-stats">${[['materials','Materi', 'book'],['personal','Catatan','notes'],['words','Mufradat','words'],['tips','Tips Nahwu','star']].map(([k,label,ic])=>`<button onclick="noteFilterSet('${k}')"><span>${ico(ic)}</span><strong>${counts[k]}</strong><small>${label}</small></button>`).join('')}</div><input id="notesSearch" class="search" value="${safe(noteQuery)}" placeholder="Smart Search: judul, isi catatan, Arab, tips..." autocomplete="off"><div id="noteFilters" class="note-filters">${noteFilterMarkup()}</div><div id="notesResults">${notesResults()}</div><button class="btn alt full" onclick="openView('mufradat')">Cari Mufradat Lain →</button>`}
function render(){applyFonts();document.body.classList.toggle('dark',dark);document.body.classList.toggle('demo-no-ads',plan==='Bulanan'||plan==='Tahunan');const s=$('#screen');let h='';const w=words[wi];if(view==='badges'){h=`<button class="back" onclick="back()">← Kembali</button><h1>Lencana Santri</h1><p>${badgeDefs.filter(x=>badgeStats()[x[3]]>=x[4]).length}/30 lencana diraih. Setiap lencana memiliki simbol dan target berbeda. Lencana terkunci akan terbuka otomatis.</p>${badgeContent()}`}else if(view==='notifications'){h=`<button class="back" onclick="back()">← Kembali</button><h1>Pemberitahuan</h1><p class="muted">Contoh berita, promosi, dan pengingat. Belum tersambung ke layanan lain.</p><div class="card"><div class="notice"><span class="tag">Pengingat belajar</span><h3 style="margin-top:9px">Sudah belajar hari ini?</h3><p>Yuk, lanjutkan satu sublevel untuk memperkuat pemahamanmu.</p></div><div class="notice"><span class="tag">Info Nahwoo</span><h3 style="margin-top:9px">Materi baru akan hadir</h3><p>Informasi pembaruan kurikulum dan bank soal nantinya ditampilkan di sini.</p></div><div class="notice"><span class="tag">Produk lainnya</span><h3 style="margin-top:9px">Kabar dari Sejuta Santri</h3><p>Tempat pengumuman aplikasi lain dan promosi yang relevan.</p></div></div>`}
else if(view==='reader'){let name=(sublevels[level-1]||[])[sub]||`Sublevel ${sub+1} — materi contoh`;let done=!!completed[`${level}-${sub}`];h=`<button class="back" onclick="back()">← Daftar sublevel</button><div class="eyebrow">LEVEL ${level} · SUBLEVEL ${sub+1}</div><h1>${name}</h1>${level===1?nahwooLessonMarkup(sub):`<p class="muted">Materi dummy untuk menguji layout.</p><div class="card"><h3>Perhatikan contoh berikut</h3><div class="word"><div class="arabic" style="font-size:var(--arabic-size)">كَتَبَ زَيْدٌ</div><b>Zaid telah menulis.</b></div><p>Dalam kalimat ini, <b>كَتَبَ</b> adalah fi‘il, sedangkan <b>زَيْدٌ</b> adalah isim yang berfungsi sebagai pelaku.</p><div class="card gold"><b>Inti pelajaran</b><p>Kenali pola dan maknanya terlebih dahulu, kemudian pahami kaidah yang menjelaskan susunannya.</p></div></div>`}${lessonNotebookMarkup()}${btn(done?'✓ Hapus tanda selesai':'✓ Tandai selesai',`toggleComplete(${sub})`,'full')}${readerNeighborButtons()}${btn('Kembali ke daftar sublevel','back()','alt full')}`}
else if(view==='quiz'){let q=questions[qi];h=`<button class="back" onclick="back()">← Keluar demo</button><div class="row"><span class="eyebrow">LATIHAN LEVEL ${level}</span><span class="pill">Soal ${qi+1}/3 demo</span></div><div class="bar"><span style="width:${(qi+1)/3*100}%"></span></div><div class="card"><h2>${q.q}</h2><div class="options">${q.a.map((a,i)=>`<button class="option ${answers[qi]===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div></div><button class="btn full" ${answers[qi]===undefined?'disabled':''} onclick="next()">${qi===2?'Kumpulkan & lihat pembahasan':'Soal berikutnya →'}</button><p class="hint">Demo hanya 3 soal. Nantinya 20 soal per sesi, jawaban dibahas setelah selesai.</p>`}
else if(view==='results'){let score=questions.reduce((a,q,i)=>a+(answers[i]===q.correct?1:0),0);h=`<h1>Hasil Latihan</h1><div class="card tint" style="text-align:center"><div class="stats">${score}/3</div><p>Jawaban benar (demo)</p></div>${questions.map((q,i)=>`<div class="card review"><b>Soal ${i+1} · ${answers[i]===q.correct?'✓ Benar':'✕ Perlu diulang'}</b><p>${q.q}</p><p><b>Jawaban: ${q.a[q.correct]}</b></p><p>${q.why}</p></div>`).join('')}<h3 style="text-align:center">Mau latihan lagi biar makin lancar?</h3>${btn('Latihan lagi',`startQuiz(${level})`,'full')}${btn('Kembali ke grid level','back()','alt full')}`}
else if(view==='notes'){h=notesPage()}
else if(view==='mufradat'){let filtered=words.map((x,i)=>({...x,i})).filter(x=>smart(searchWords,[x.ar,x.meaning,x.kind,x.translation].join(' ')));h=`<button class="back" onclick="back()">← Kembali</button><h1>Mufradat</h1><p class="muted">Pencarian pintar dengan toleransi typo (demo 4 kata). Database 10.000 mufradat menyusul.</p>${searchBox('wordSearch',searchWords,'Cari arti, Arab, atau jenis kata...')}${savedWordsBlock()}<div id="wordResults">${wordResults(searchWords.trim()?filtered:sampleWords())}</div>`}
else if(view==='license'){let plans=[['Free','Level 1–12, latihan Level 1–12 · Dengan iklan','Gratis'],['Freemium','Level 1–24 dan seluruh latihan · Dengan iklan · Verifikasi WhatsApp','Gratis'],['Bulanan','Level 1–24 dan seluruh latihan · Tanpa iklan','Rp 9.900 / bulan'],['Tahunan','Level 1–24 dan seluruh latihan · Tanpa iklan','Rp 99.000 / tahun']];h=`<button class="back" onclick="back()">← Kembali</button><h1>Lisensi Nahwoo</h1><div class="card tint"><span class="eyebrow">LISENSI AKTIF · DEMO</span><h2>${plan==='Bulanan'?'Premium Bulanan':plan==='Tahunan'?'Premium Tahunan':plan}</h2><p>Tagihan berikutnya: ${['Bulanan','Tahunan'].includes(plan)?'Belum tersedia — Google Play Billing belum aktif':'Tidak ada'}</p></div><div class="card"><h3>Empat jenis lisensi</h3>${plans.map(([name,desc,price])=>`<div class="pay"><div class="row"><div style="flex:1"><b>${name==='Bulanan'?'Premium Bulanan':name==='Tahunan'?'Premium Tahunan':name}</b><p>${desc}</p><b>${price}</b></div><button class="btn alt" onclick="choosePlan('${name}')">${plan===name?'Aktif':'Pilih'}</button></div></div>`).join('')}<p class="demo-license-note">MODE DEMO: Bebas memilih keempat lisensi tanpa pembayaran atau verifikasi WhatsApp. Akses level dan tampilan iklan berubah langsung sesuai pilihan.</p></div><div class="card"><h3>Verifikasi WhatsApp</h3><p>Nomor: <b>${whatsapp?safe(whatsapp):'Belum diisi'}</b></p><p>Status: <b>${waVerified?'Terverifikasi':'Belum terverifikasi'}</b></p>${btn('Lengkapi identitas',"setTab('settings')",'full alt')}${btn('Konfirmasi via WhatsApp','showVerificationInfo()','full')}</div><div class="card"><h3>Riwayat pembelian</h3><p>Belum ada transaksi. Riwayat nyata dan tagihan berikutnya nantinya berasal dari Google Play Billing.</p></div>`}
else if(tab==='home'){let last=Object.keys(completed).filter(k=>completed[k]).pop(),lastLevel=last?Number(last.split('-')[0]):1,lastSub=last?Number(last.split('-')[1]):0;h=`<p class="muted" style="margin-bottom:12px">Assalamu'alaikum, ${nickname?safe(nickname):'Santri Nahwoo'}!</p><div class="home-duo"><div class="home-left-stack"><div class="card home-mini home-last"><div class="mini-label">${ico('book','sicon')}<span>LANJUT BELAJAR</span></div><h3 class="mini-title">${safe(levels[lastLevel-1])}</h3><p class="mini-sub">Level ${lastLevel} · Sublevel ${Math.min(10,last?lastSub+2:1)}</p><div class="mini-grow"></div><div class="mini-progress-label"><span>Progres</span><b>${progress(lastLevel)*10}%</b></div><div class="bar mini-bar"><span style="width:${progress(lastLevel)*10}%"></span></div>${btn('Lanjut →',`level=${lastLevel};opened=${lastLevel};tab='learn';view='';showReader(${Math.min(9,last?lastSub+1:0)})`,'full')}</div><button class="home-license" onclick="openView('license')" aria-label="Lisensi ${safe(plan)}">${ico('license')}<span><strong>Lisensi</strong><small>${plan==='Bulanan'?'PREMIUM BULANAN':plan==='Tahunan'?'PREMIUM TAHUNAN':safe(plan).toUpperCase()}</small></span>${ico('arrow')}</button></div><div class="card home-mini home-vocab"><div class="mini-label">${ico('words','sicon')}<span>MUFRADAT HARI INI</span></div><div class="mini-arabic arabic" lang="ar">${w.ar}</div><div class="mini-meaning">${safe(w.meaning)}</div><div class="mini-kind muted">${safe(w.kind)}</div><div class="mini-example"><div class="arabic" lang="ar">${w.example}</div><p>${safe(w.translation)}</p></div><div class="mini-grow"></div><div class="mini-word-actions"><button onclick="toggleWord()" aria-label="Simpan mufradat">${wordSaved.includes(w.ar)?'★':'☆'}</button><button onclick="nextWord()">Ganti ↻</button></div></div></div><div class="grid3" style="margin-bottom:15px">${[['book','Belajar',"setTab('learn')"],['pen','Latihan',"setTab('practice')"],['chart','Progres',"setTab('progress')"],['notes','Catatan',"openView('notes')"],[dark?'sun':'moon','Dark Mode',"switchDark()"],['settings','Pengaturan',"setTab('settings')"]].map(([ic,t,fn])=>`<button class="tile" onclick="${fn}" aria-label="${t}">${ico(ic)}<strong>${t}</strong></button>`).join('')}</div>${tipsMarkup()}`}

function bindSearch(id,cb){let el=$('#'+id);if(el)el.addEventListener('input',e=>cb(e.target.value))}function learnResults(){let out=levels.map((l,i)=>{let n=i+1,subs=sublevels[i]||[],matching=smart(searchLearn,`level ${n} ${l}`)||subs.some(x=>smart(searchLearn,x));if(!matching)return '';let expanded=opened===n||!!searchLearn.trim();return `<button class="level ${expanded?'selected':''}" onclick="${isLocked(n)?`lockInfo(${n})`:`toggleLevel(${n})`}"><span class="eyebrow">LEVEL ${n} · ${isLocked(n)?"🔒 TERKUNCI":progress(n)+"/10 SELESAI"}</span><div class="row"><b>${l}</b><span>${expanded?'⌃':'⌄'}</span></div></button>${expanded?`<div id="level-detail-${n}" class="level-detail"><div style="margin-bottom:12px">${Array.from({length:10},(_,j)=>{let name=subs[j]||`Sublevel ${j+1} — materi akan dirinci`,done=!!completed[`${n}-${j}`];return `<div class="sub"><span style="color:${done?'var(--blue)':'var(--muted)'}">${done?'✓':'○'}</span><button class="subname" onclick="level=${n};showReader(${j})">${j+1}. ${name}</button><span class="${done?'sub-done':'muted'}">${done?'✓ Selesai':'○'}</span></div>`}).join('')}<button class="sub" style="width:calc(100% - 9px);text-align:left;cursor:pointer;display:block" onclick="${isLocked(n)?`lockInfo(${n})`:`startQuiz(${n})`}"><b>✎ Ujian Akhir Level ${n}</b><div class="bar" style="background:var(--soft)"><span style="width:${(seen[n]||0)/1001*100}%"></span></div><span class="muted">${seen[n]||0}/1001 soal · Tidak memengaruhi progres belajar</span></button></div></div>`:''}`}).join('');return (searchLearn.trim()?suggestionMarkup(searchLearn,levels.concat(sublevels.flat()),'learn')+learnMatches(searchLearn):'')+(out||'<div class="empty">Level tidak ditemukan. Coba kata lain.</div>')}function quizResults(){let out=levels.map((l,i)=>{let n=i+1;if(!smart(searchQuiz,`level ${n} ${l}`))return '';let p=(seen[n]||0)/1001*100;return `<button class="leveltile" onclick="${isLocked(n)?`lockInfo(${n})`:`startQuiz(${n})`}">${ico('book')}<b>${isLocked(n)?"🔒 ":""}Level ${n}</b><small>${l}</small><div class="bar"><span style="width:${p}%"></span></div><span class="muted">${p.toFixed(1)}%</span></button>`}).join('');return suggestionMarkup(searchQuiz,levels.map((x,i)=>`level ${i+1} ${x}`).concat(levels),'quiz')+(out||'<div class="empty">Level tidak ditemukan. Coba kata lain.</div>')}function sampleWords(){const arr=words.map((x,i)=>({...x,i}));for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr.slice(0,3)}
function relevantResults(q,items,field){if(!q.trim())return '';const nq=normalize(q);let ranked=items.map(x=>{const label=String(x.label),nl=normalize(label);const terms=nl.split(' ');let score=nl.includes(nq)?0:Math.min(...terms.map(w=>distance(nq,w)));return {...x,score}}).filter(x=>x.score<=Math.max(2,Math.floor(nq.length/3))||normalize(x.label).includes(nq)).sort((a,b)=>a.score-b.score).slice(0,9);if(!ranked.length)return '<div class="empty">Belum ada hasil terkait dalam data demo.</div>';return `<div class="search-related"><b>Hasil yang mungkin dicari</b>${ranked.map(x=>`<button class="search-hit" onclick="${x.action}"><span class="tag">${x.type}</span><span>${safe(x.label)}</span> →</button>`).join('')}</div>`}
function learnMatches(q){let all=[];levels.forEach((name,i)=>{let n=i+1;all.push({label:`Level ${n} · ${name}`,type:'Level',action:`opened=${n};searchLearn='';setTab('learn')`});Array.from({length:10},(_,j)=>{let title=(sublevels[i]||[])[j]||`Sublevel ${j+1} — materi akan dirinci`;all.push({label:`Level ${n} · ${j+1}. ${title}`,type:'Sublevel',action:`level=${n};showReader(${j})`})})});return relevantResults(q,all,'learn')}
function wordMatches(q){return relevantResults(q,words.map((x,i)=>({label:`${x.ar} · ${x.meaning} (${x.kind})`,type:'Mufradat',action:`searchWords=${JSON.stringify(x.meaning)};render()`})),'word')}
function savedWordsBlock(){const list=words.filter(x=>wordSaved.includes(x.ar));return `<div class="card saved-words-card"><button class="saved-words-head" onclick="toggleSavedPanel()" aria-expanded="${savedPanelOpen}"><span class="saved-words-icon">★</span><span class="saved-words-title"><strong>Mufradat Tersimpan</strong><small>${wordSaved.length} kata disimpan</small></span><span class="saved-words-count">${wordSaved.length}</span><span class="saved-words-arrow">${savedPanelOpen?'⌃':'⌄'}</span></button>${savedPanelOpen?`<div class="saved-words-list">${list.length?list.map(x=>`<div class="saved-words-item"><div><div class="arabic" lang="ar">${x.ar}</div><strong>${safe(x.meaning)}</strong><small>${safe(x.kind)}</small></div><button class="saved-remove" onclick="toggleSavedWord(${JSON.stringify(x.ar)})" aria-label="Hapus ${safe(x.meaning)} dari tersimpan">★ Hapus</button></div>`).join(''):`<p class="muted" style="margin:10px 0 2px">Belum ada mufradat tersimpan. Ketuk ☆ Simpan pada kata yang ingin dipelajari lagi.</p>`}</div>`:''}</div>`}function wordResults(items){let hint=searchWords.trim()?suggestionMarkup(searchWords,words.flatMap(x=>[x.meaning,x.kind,x.translation,x.ar]),'word')+wordMatches(searchWords):'<p class="hint">3 mufradat acak sebagai contoh. Gunakan pencarian untuk menemukan kata.</p>'; if(!items.length){let q=normalize(searchWords);let suggestion=words.map(x=>x.meaning).sort((a,b)=>distance(q,normalize(a))-distance(q,normalize(b)))[0];return hint+`<div class="card"><p>Tidak ditemukan. Mungkin maksudmu <b>${safe(suggestion||'kata lain')}</b>?</p><p class="hint">Koreksi typo demo; pencarian 10.000 kata akan disiapkan saat database tersedia.</p></div>`}return hint+items.map(x=>`<div class="card"><div class="row"><div><h2>${x.meaning}</h2><span class="muted">${x.kind}</span></div><span class="arabic" style="font-size:25px">${x.ar}</span></div><p class="arabic" style="font-size:23px;margin:0">${x.example}</p><p>${x.translation}</p><button class="word-save-button" onclick="toggleSavedWord(${JSON.stringify(x.ar)})">${wordSaved.includes(x.ar)?'★ Tersimpan · Hapus':'☆ Simpan mufradat'}</button></div>`).join('')}function choosePlan(p){if(!['Free','Freemium','Bulanan','Tahunan'].includes(p))return;plan=p;persist();render();showModal(`<h2>Lisensi demo aktif</h2><p>Mode <b>${p==='Bulanan'?'Premium Bulanan':p==='Tahunan'?'Premium Tahunan':p}</b> sekarang aktif untuk pengujian tampilan.</p><p>${p==='Free'?'Level 13–24 terkunci dan iklan demo ditampilkan.':p==='Freemium'?'Semua level terbuka dan iklan demo tetap tampil.':'Semua level terbuka dan banner maupun interstitial iklan demo disembunyikan.'}</p><p class="hint">Ini hanya pilihan mode pada prototipe HTML. Tidak ada pembayaran atau verifikasi WhatsApp.</p><button class="btn full" onclick="closeModal()">Lanjutkan</button>`)}

function tourGo(i){
 if(!tutorialActive)return;
 tutorialStep=Math.max(0,Math.min(i,tourSteps.length-1));
 const st=tourSteps[tutorialStep];
 tab=st.tab||'home';view=st.view||'';
 if(st.tab==='learn'){opened=0;if(st.view==='reader'){level=1;sub=0;}}
 render();
 const layer=document.getElementById('tour-layer');if(!layer)return;
 const spot=layer.querySelector('.tour-spot'),panel=layer.querySelector('.tour-panel');
 layer.classList.remove('active');
 panel.innerHTML=`<div class="tour-meta"><strong>Panduan Nahwoo</strong><span>${tutorialStep+1} / ${tourSteps.length}</span></div><div class="tour-progress"><span style="width:${(tutorialStep+1)/tourSteps.length*100}%"></span></div><h3>${st.title}</h3><p>${st.text}</p><div class="tour-actions"><button class="tour-skip" onclick="finishTutorial()">Lewati</button>${tutorialStep?'<button class="tour-back" onclick="tourGo(tutorialStep-1)">Kembali</button>':''}<button class="tour-next" onclick="${tutorialStep===tourSteps.length-1?'finishTutorial()':'tourGo(tutorialStep+1)'}">${tutorialStep===tourSteps.length-1?'Selesai':'Lanjut →'}</button></div>`;
 const target=st.tab==='learn'?Array.from(document.querySelectorAll('.level')).find(x=>x.textContent.includes('LEVEL 13')):document.querySelector(st.selector);
 if(target){target.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});}
 setTimeout(()=>{
  if(!tutorialActive||tutorialStep!==i)return;
  const t=st.tab==='learn'?Array.from(document.querySelectorAll('.level')).find(x=>x.textContent.includes('LEVEL 13')):document.querySelector(st.selector);
  if(t){const r=t.getBoundingClientRect(),pad=5;spot.style.display='block';spot.style.left=Math.max(4,r.left-pad)+'px';spot.style.top=Math.max(4,r.top-pad)+'px';spot.style.width=Math.min(innerWidth-8,r.width+pad*2)+'px';spot.style.height=Math.max(30,r.height+pad*2)+'px';}else{spot.style.display='none';}
  layer.classList.add('active');
 },450);
}
// Block user scroll and application interaction while the guided tour is active.
// Programmatic scrollIntoView remains available to position highlighted targets.
function tourBlockScroll(e){
 if(!tutorialActive)return;
 if(e.target.closest && e.target.closest('.tour-panel'))return;
 e.preventDefault();
}
function tourBlockKeys(e){
 if(!tutorialActive)return;
 if(e.key==='Escape'){e.preventDefault();e.stopPropagation();return;}
 const panel=document.querySelector('#tour-layer .tour-panel');
 if(e.key==='Tab'){
  const buttons=panel?Array.from(panel.querySelectorAll('button:not([disabled])')):[];
  if(!buttons.length){e.preventDefault();return;}
  const current=buttons.indexOf(document.activeElement);
  e.preventDefault();buttons[(current+(e.shiftKey?-1:1)+buttons.length)%buttons.length].focus();return;
 }
 if(['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' ','ArrowLeft','ArrowRight'].includes(e.key)){
  if(panel && panel.contains(document.activeElement) && ['ArrowDown','ArrowUp','PageDown','PageUp'].includes(e.key))return;
  e.preventDefault();e.stopPropagation();
 }
}
document.addEventListener('wheel',tourBlockScroll,{passive:false,capture:true});
document.addEventListener('touchmove',tourBlockScroll,{passive:false,capture:true});
document.addEventListener('keydown',tourBlockKeys,true);
function startTutorial(){
 if(tutorialActive)return;
 document.querySelector('#overlay').innerHTML='';tutorialActive=true;document.documentElement.classList.add('tour-locked');document.body.classList.add('tour-locked');
 let layer=document.createElement('div');layer.id='tour-layer';layer.setAttribute('role','dialog');layer.setAttribute('aria-label','Panduan interaktif Nahwoo');
 layer.innerHTML='<div class="tour-spot"></div><div class="tour-panel"></div>';
 document.body.appendChild(layer);tourGo(0);
}
function finishTutorial(){
 tutorialActive=false;document.documentElement.classList.remove('tour-locked');document.body.classList.remove('tour-locked');tutorialSeen=true;localStorage.setItem('nahwoo-tour-seen-v1','1');
 const layer=document.getElementById('tour-layer');if(layer){layer.classList.remove('active');setTimeout(()=>layer.remove(),330)}
 tab='home';view='';render();window.scrollTo({top:0,behavior:'smooth'});
 if(window.__nahwooLoginAfterTour){window.__nahwooLoginAfterTour=false;showLogin()}
}

// Fit seluruh konten Beranda di antara header dan navigasi, memperhitungkan banner iklan.
// Pengukuran dilakukan setelah render; halaman lain tidak dibatasi scroll-nya.
let homeFitBusy=false;
function fitNahwooHome(){
 const active=tab==='home'&&!view;
 document.body.classList.toggle('home-one-screen',active);
 const screen=document.getElementById('screen');
 if(!screen)return;
 // Reset all previous sizing BEFORE measuring, including after tab changes.
 screen.style.transform='';
 screen.style.zoom='1';
 screen.style.width='100%';
 if(!active)return;
 const nav=document.getElementById('nav');
 const header=document.querySelector('.app header');
 if(!nav||!header)return;
 const available=Math.max(1,nav.getBoundingClientRect().top-header.getBoundingClientRect().bottom);
 const needed=Math.max(1,screen.scrollHeight);
 const ratio=Math.max(.35,Math.min(1,available/needed));
 // CSS zoom scales layout and hit targets together. Unlike transform:scale,
 // it cannot collide with the page-enter animation's own transform.
 // Compensate the layout width so the final painted width remains exact.
 screen.style.width=(100/ratio)+'%';
 screen.style.zoom=String(ratio);
}
window.addEventListener('resize',()=>requestAnimationFrame(fitNahwooHome));
window.addEventListener('orientationchange',()=>requestAnimationFrame(fitNahwooHome));


/* Event delegation: works with buttons recreated by render(), including tutorial. */
(function nahwooPressFeedback(){
 const selector='button:not(:disabled),[role="button"],a[href],summary';
 const pressed=new Set();
 function release(el){if(!el)return;el.classList.remove('nahwoo-pressed');pressed.delete(el)}
 document.addEventListener('pointerdown',e=>{
   if(e.button!==0||e.isPrimary===false)return;
   const el=e.target.closest?.(selector);if(!el)return;
   el.classList.add('nahwoo-pressed');pressed.add(el);
 },{passive:true,capture:true});
 for(const type of ['pointerup','pointercancel','dragstart']){
   document.addEventListener(type,()=>{for(const el of pressed)release(el)},{capture:true,passive:true});
 }
 window.addEventListener('blur',()=>{for(const el of pressed)release(el)});
})();

const NAHWOO_LEVEL1_V2=[{"id":"L1-S01","title":"Membaca Arab Belum Tentu Memahami Maknanya","sections":[{"heading":"Mari mulai","text":["Pernah lancar melafalkan sebuah kalimat, tetapi mendadak diam ketika diminta menjelaskan maksudnya? Itu pengalaman yang sangat wajar. Membaca bunyi dan menangkap pesan adalah dua keterampilan yang saling mendukung, bukan hal yang sama."],"words":[]},{"heading":"Target belajar","text":["Setelah bagian ini, kamu dapat mengenali gagasan utama “membaca arab belum tentu memahami maknanya”, menjelaskan fungsi unsur penting dalam contoh, dan mencoba membaca contoh baru sebelum melihat artinya."],"words":[]},{"heading":"Perhatikan kalimat ini","text":["Bacalah perlahan satu kali. Lalu tahan keinginan untuk langsung melihat terjemahan. Cari lebih dulu kata yang sudah kamu kenali, kemudian perhatikan apa yang dikatakan tentangnya.","قَرَأَ زَيْدٌ الْكِتَابَ","Zaid telah membaca buku itu."],"words":[]},{"heading":"Bedah kata","text":["Satu kalimat menjadi lebih mudah ketika setiap bagian diberi pekerjaan yang jelas. Perhatikan bukan hanya arti Indonesianya, tetapi juga apa yang dilakukan kata tersebut dalam rangkaian."],"words":[{"arabic":"قَرَأَ","meaning":"telah membaca","role":"tindakan"},{"arabic":"زَيْدٌ","meaning":"Zaid","role":"pelaku"},{"arabic":"الْكِتَابَ","meaning":"buku itu","role":"sesuatu yang dibaca"}]},{"heading":"Tiga lapis keterampilan","text":["Pertama, mata mengenali tulisan dan mulut melafalkan bunyi. Kedua, ingatan menghubungkan kata dengan arti. Ketiga, pikiran menyatukan unsur-unsur itu menjadi pesan. Ketiga tahap ini dapat berkembang dengan kecepatan berbeda. Kamu boleh fasih membaca tetapi masih perlu belajar kosakata dan susunan."],"words":[]},{"heading":"Lihat lebih dekat","text":["Membaca Al-Qur’an dengan tartil tetap bernilai dan memiliki ilmu tersendiri. Di sini kita tidak menilai kualitas tilawah atau menafsirkan ayat. Kita hanya melatih kemampuan bahasa agar pembacaan disertai pemahaman yang makin baik."],"words":[]},{"heading":"Coba pikirkan lagi","text":["Kembali ke contoh utama: Zaid telah membaca buku itu. Sekarang tutup terjemahannya sejenak. Sebutkan unsur yang paling penting lebih dahulu, lalu jelaskan mengapa unsur lain diperlukan. Kalau kamu bisa menunjukkan bukti pada kata Arab, pemahamanmu lebih kuat daripada sekadar mengingat terjemahan."],"words":[]},{"heading":"Bandingkan dengan pengalaman sehari-hari","text":["Dalam percakapan Indonesia pun kita tidak memahami pesan hanya dengan mengenal bunyi. Kata “rumah”, misalnya, belum memberi tahu apakah seseorang masuk, keluar, atau sedang berada di sana. Demikian juga contoh Arab di atas: unsur-unsur bekerja bersama. Keterampilan yang kita bangun adalah mengajukan pertanyaan yang tepat kepada teks, bukan menebak cerita dari satu kata yang kebetulan dikenal."],"words":[]},{"heading":"Momen aha!","text":["Sekarang kamu punya cara memeriksa diri: bukan “apakah aku bisa membaca قَرَأَ?”, melainkan “apakah aku dapat menjelaskan perannya dan hubungan dengan kata lain?” Perubahan pertanyaan kecil ini membuat latihan bahasa jauh lebih terarah."],"words":[]},{"heading":"Cara berlatih secara mandiri","text":["Buat latihan dua putaran. Pada putaran pertama, baca contoh Arab dengan tenang, tandai kata yang sudah dikenal, lalu jelaskan maknanya tanpa bantuan. Pada putaran kedua, periksa terjemahan dan bedah kata. Jika ada perbedaan, jangan langsung menghapus jawaban awalmu. Cari penyebabnya: apakah kosakatanya belum dikenal, hubungan katanya terlewat, atau kamu terlalu cepat menebak? Catatan kecil tentang kesalahanmu akan membantu latihan berikutnya."],"words":[]},{"heading":"Kesalahan yang perlu dihindari","text":["Jangan menyamakan harakat dengan terjemahan otomatis. Harakat membantu membaca dan kadang memberi petunjuk bentuk, tetapi makna kalimat tetap memerlukan kosakata dan hubungan antarunsur. Jangan pula menganggap contoh sederhana ini mewakili seluruh variasi bahasa Arab."],"words":[]},{"heading":"Latihan cepat","text":["Baca contoh baru berikut tanpa melihat jawaban:","جَلَسَ الطَّالِبُ","Siapa yang duduk?","Coba jawab dengan suara pelan atau tulis satu kalimat pendek. Pemeriksaan jawaban tersedia di bagian produksi, bukan pada halaman belajar ini."],"words":[],"answer":"Murid itu. Kata جَلَسَ menyatakan duduk, sedangkan الطَّالِبُ menunjuk pelakunya."},{"heading":"Pegangan hari ini","text":["Inti pelajaran “Membaca Arab Belum Tentu Memahami Maknanya” adalah memperhatikan bukti dalam kata dan hubungannya. Kamu tidak perlu menghafal seluruh istilah hari ini; cukup dapat menunjukkan bagian yang membuat pesan menjadi masuk akal."],"words":[]},{"heading":"Lanjutkan perjalanan","text":["Setelah ini, kita beralih ke “Dari Kata Menjadi Kalimat”. Gunakan keterampilan hari ini sebagai bekal, bukan sebagai daftar yang harus dihafal sempurna."],"words":[]}]},{"id":"L1-S02","title":"Dari Kata Menjadi Kalimat","sections":[{"heading":"Mari mulai","text":["Bayangkan kamu menemukan kata بَيْتٌ pada papan latihan. Kamu tahu artinya rumah. Namun apakah kamu sudah tahu apa yang sedang diceritakan tentang rumah itu? Belum tentu."],"words":[]},{"heading":"Target belajar","text":["Setelah bagian ini, kamu dapat mengenali gagasan utama “dari kata menjadi kalimat”, menjelaskan fungsi unsur penting dalam contoh, dan mencoba membaca contoh baru sebelum melihat artinya."],"words":[]},{"heading":"Perhatikan kalimat ini","text":["Bacalah perlahan satu kali. Lalu tahan keinginan untuk langsung melihat terjemahan. Cari lebih dulu kata yang sudah kamu kenali, kemudian perhatikan apa yang dikatakan tentangnya.","الْبَيْتُ كَبِيرٌ","Rumah itu besar."],"words":[]},{"heading":"Bedah kata","text":["Satu kalimat menjadi lebih mudah ketika setiap bagian diberi pekerjaan yang jelas. Perhatikan bukan hanya arti Indonesianya, tetapi juga apa yang dilakukan kata tersebut dalam rangkaian."],"words":[{"arabic":"الْبَيْتُ","meaning":"rumah itu","role":"yang sedang dibicarakan"},{"arabic":"كَبِيرٌ","meaning":"besar","role":"informasi tentang rumah"}]},{"heading":"Unit yang berbeda","text":["Kata dapat berdiri sebagai satu unsur makna. Gabungan seperti بَابُ الْبَيْتِ menyebut pintu rumah, tetapi belum mengatakan apa yang terjadi dengannya. Kalimat الْبَيْتُ كَبِيرٌ sudah memberi informasi yang bisa dipahami. Jadi banyaknya kata saja tidak menentukan apakah pesan sudah lengkap."],"words":[]},{"heading":"Lihat lebih dekat","text":["Ketika menerjemahkan, jangan memaksa setiap kata selalu memiliki satu kata Indonesia yang sejajar. Bahasa Indonesia kadang memerlukan kata “itu”, “adalah”, atau susunan berbeda supaya pesannya alami."],"words":[]},{"heading":"Coba pikirkan lagi","text":["Kembali ke contoh utama: Rumah itu besar. Sekarang tutup terjemahannya sejenak. Sebutkan unsur yang paling penting lebih dahulu, lalu jelaskan mengapa unsur lain diperlukan. Kalau kamu bisa menunjukkan bukti pada kata Arab, pemahamanmu lebih kuat daripada sekadar mengingat terjemahan."],"words":[]},{"heading":"Bandingkan dengan pengalaman sehari-hari","text":["Dalam percakapan Indonesia pun kita tidak memahami pesan hanya dengan mengenal bunyi. Kata “rumah”, misalnya, belum memberi tahu apakah seseorang masuk, keluar, atau sedang berada di sana. Demikian juga contoh Arab di atas: unsur-unsur bekerja bersama. Keterampilan yang kita bangun adalah mengajukan pertanyaan yang tepat kepada teks, bukan menebak cerita dari satu kata yang kebetulan dikenal."],"words":[]},{"heading":"Momen aha!","text":["Sekarang kamu punya cara memeriksa diri: bukan “apakah aku bisa membaca الْبَيْتُ?”, melainkan “apakah aku dapat menjelaskan perannya dan hubungan dengan kata lain?” Perubahan pertanyaan kecil ini membuat latihan bahasa jauh lebih terarah."],"words":[]},{"heading":"Cara berlatih secara mandiri","text":["Buat latihan dua putaran. Pada putaran pertama, baca contoh Arab dengan tenang, tandai kata yang sudah dikenal, lalu jelaskan maknanya tanpa bantuan. Pada putaran kedua, periksa terjemahan dan bedah kata. Jika ada perbedaan, jangan langsung menghapus jawaban awalmu. Cari penyebabnya: apakah kosakatanya belum dikenal, hubungan katanya terlewat, atau kamu terlalu cepat menebak? Catatan kecil tentang kesalahanmu akan membantu latihan berikutnya."],"words":[]},{"heading":"Kesalahan yang perlu dihindari","text":["Jangan menyamakan harakat dengan terjemahan otomatis. Harakat membantu membaca dan kadang memberi petunjuk bentuk, tetapi makna kalimat tetap memerlukan kosakata dan hubungan antarunsur. Jangan pula menganggap contoh sederhana ini mewakili seluruh variasi bahasa Arab."],"words":[]},{"heading":"Latihan cepat","text":["Baca contoh baru berikut tanpa melihat jawaban:","بَابُ الْبَيْتِ","Apakah ini sudah menyampaikan berita lengkap?","Coba jawab dengan suara pelan atau tulis satu kalimat pendek. Pemeriksaan jawaban tersedia di bagian produksi, bukan pada halaman belajar ini."],"words":[],"answer":"Belum; ungkapan ini berarti pintu rumah dan masih dapat dilengkapi dengan informasi lain."},{"heading":"Pegangan hari ini","text":["Inti pelajaran “Dari Kata Menjadi Kalimat” adalah memperhatikan bukti dalam kata dan hubungannya. Kamu tidak perlu menghafal seluruh istilah hari ini; cukup dapat menunjukkan bagian yang membuat pesan menjadi masuk akal."],"words":[]},{"heading":"Lanjutkan perjalanan","text":["Setelah ini, kita beralih ke “Tiga Keluarga Kata Arab”. Gunakan keterampilan hari ini sebagai bekal, bukan sebagai daftar yang harus dihafal sempurna."],"words":[]}]},{"id":"L1-S03","title":"Tiga Keluarga Kata Arab","sections":[{"heading":"Mari mulai","text":["Saat membaca bahasa Arab, kamu tidak perlu langsung menghafal puluhan istilah. Cukup ajukan pertanyaan sederhana: kata ini menunjuk sesuatu, menyatakan kejadian, atau menghubungkan makna?"],"words":[]},{"heading":"Target belajar","text":["Setelah bagian ini, kamu dapat mengenali gagasan utama “tiga keluarga kata arab”, menjelaskan fungsi unsur penting dalam contoh, dan mencoba membaca contoh baru sebelum melihat artinya."],"words":[]},{"heading":"Perhatikan kalimat ini","text":["Bacalah perlahan satu kali. Lalu tahan keinginan untuk langsung melihat terjemahan. Cari lebih dulu kata yang sudah kamu kenali, kemudian perhatikan apa yang dikatakan tentangnya.","ذَهَبَ خَالِدٌ إِلَى الْمَسْجِدِ","Khalid telah pergi ke masjid."],"words":[]},{"heading":"Bedah kata","text":["Satu kalimat menjadi lebih mudah ketika setiap bagian diberi pekerjaan yang jelas. Perhatikan bukan hanya arti Indonesianya, tetapi juga apa yang dilakukan kata tersebut dalam rangkaian."],"words":[{"arabic":"ذَهَبَ","meaning":"telah pergi","role":"fi‘il: peristiwa"},{"arabic":"خَالِدٌ","meaning":"Khalid","role":"isim: nama"},{"arabic":"إِلَى","meaning":"ke","role":"huruf: arah"},{"arabic":"الْمَسْجِدِ","meaning":"masjid","role":"isim: tempat"}]},{"heading":"Peta tiga kelompok","text":["Isim membantu kita mengenali orang, benda, tempat, sifat, atau gagasan. Fi‘il memberi petunjuk peristiwa yang berkaitan dengan waktu. Huruf ma‘ani menghubungkan makna, seperti إِلَى yang menunjukkan arah pada contoh. Ini peta awal, bukan daftar lengkap tanda gramatika."],"words":[]},{"heading":"Lihat lebih dekat","text":["Kata الْمَسْجِدِ tetap termasuk isim meskipun berada setelah إِلَى. Huruf yang mendahuluinya tidak mengubahnya menjadi huruf. Kelompok kata dan fungsi dalam kalimat adalah dua pertanyaan yang berbeda."],"words":[]},{"heading":"Coba pikirkan lagi","text":["Kembali ke contoh utama: Khalid telah pergi ke masjid. Sekarang tutup terjemahannya sejenak. Sebutkan unsur yang paling penting lebih dahulu, lalu jelaskan mengapa unsur lain diperlukan. Kalau kamu bisa menunjukkan bukti pada kata Arab, pemahamanmu lebih kuat daripada sekadar mengingat terjemahan."],"words":[]},{"heading":"Bandingkan dengan pengalaman sehari-hari","text":["Dalam percakapan Indonesia pun kita tidak memahami pesan hanya dengan mengenal bunyi. Kata “rumah”, misalnya, belum memberi tahu apakah seseorang masuk, keluar, atau sedang berada di sana. Demikian juga contoh Arab di atas: unsur-unsur bekerja bersama. Keterampilan yang kita bangun adalah mengajukan pertanyaan yang tepat kepada teks, bukan menebak cerita dari satu kata yang kebetulan dikenal."],"words":[]},{"heading":"Momen aha!","text":["Sekarang kamu punya cara memeriksa diri: bukan “apakah aku bisa membaca ذَهَبَ?”, melainkan “apakah aku dapat menjelaskan perannya dan hubungan dengan kata lain?” Perubahan pertanyaan kecil ini membuat latihan bahasa jauh lebih terarah."],"words":[]},{"heading":"Cara berlatih secara mandiri","text":["Buat latihan dua putaran. Pada putaran pertama, baca contoh Arab dengan tenang, tandai kata yang sudah dikenal, lalu jelaskan maknanya tanpa bantuan. Pada putaran kedua, periksa terjemahan dan bedah kata. Jika ada perbedaan, jangan langsung menghapus jawaban awalmu. Cari penyebabnya: apakah kosakatanya belum dikenal, hubungan katanya terlewat, atau kamu terlalu cepat menebak? Catatan kecil tentang kesalahanmu akan membantu latihan berikutnya."],"words":[]},{"heading":"Kesalahan yang perlu dihindari","text":["Jangan menyamakan harakat dengan terjemahan otomatis. Harakat membantu membaca dan kadang memberi petunjuk bentuk, tetapi makna kalimat tetap memerlukan kosakata dan hubungan antarunsur. Jangan pula menganggap contoh sederhana ini mewakili seluruh variasi bahasa Arab."],"words":[]},{"heading":"Latihan cepat","text":["Baca contoh baru berikut tanpa melihat jawaban:","فِي الْبَيْتِ","Manakah huruf yang menghubungkan makna tempat?","Coba jawab dengan suara pelan atau tulis satu kalimat pendek. Pemeriksaan jawaban tersedia di bagian produksi, bukan pada halaman belajar ini."],"words":[],"answer":"فِي, yang dalam contoh ini berarti di."},{"heading":"Pegangan hari ini","text":["Inti pelajaran “Tiga Keluarga Kata Arab” adalah memperhatikan bukti dalam kata dan hubungannya. Kamu tidak perlu menghafal seluruh istilah hari ini; cukup dapat menunjukkan bagian yang membuat pesan menjadi masuk akal."],"words":[]},{"heading":"Lanjutkan perjalanan","text":["Setelah ini, kita beralih ke “Arti Kata Tumbuh Bersama Konteks”. Gunakan keterampilan hari ini sebagai bekal, bukan sebagai daftar yang harus dihafal sempurna."],"words":[]}]},{"id":"L1-S04","title":"Arti Kata Tumbuh Bersama Konteks","sections":[{"heading":"Mari mulai","text":["Kamus memberi kita pintu masuk. Tetapi makna sebuah kata menjadi lebih jelas ketika ia berada bersama kata lain. Karena itu, pembaca yang teliti tidak berhenti pada satu padanan terjemahan."],"words":[]},{"heading":"Target belajar","text":["Setelah bagian ini, kamu dapat mengenali gagasan utama “arti kata tumbuh bersama konteks”, menjelaskan fungsi unsur penting dalam contoh, dan mencoba membaca contoh baru sebelum melihat artinya."],"words":[]},{"heading":"Perhatikan kalimat ini","text":["Bacalah perlahan satu kali. Lalu tahan keinginan untuk langsung melihat terjemahan. Cari lebih dulu kata yang sudah kamu kenali, kemudian perhatikan apa yang dikatakan tentangnya.","فَتَحَ الْوَلَدُ الْبَابَ","Anak laki-laki itu membuka pintu."],"words":[]},{"heading":"Bedah kata","text":["Satu kalimat menjadi lebih mudah ketika setiap bagian diberi pekerjaan yang jelas. Perhatikan bukan hanya arti Indonesianya, tetapi juga apa yang dilakukan kata tersebut dalam rangkaian."],"words":[{"arabic":"فَتَحَ","meaning":"membuka","role":"tindakan"},{"arabic":"الْوَلَدُ","meaning":"anak laki-laki itu","role":"pelaku"},{"arabic":"الْبَابَ","meaning":"pintu","role":"yang dibuka"}]},{"heading":"Makna dan lingkungan","text":["Dalam kalimat tentang membuka pintu, الْبَابَ menunjuk benda yang bisa dibuka. Namun dalam ungkapan بَابُ الْعِلْمِ, kata yang sama dapat dipakai untuk gambaran jalan menuju pengetahuan. Kita mengenali makna dari lingkungan kata, bukan menebak tanpa bukti."],"words":[]},{"heading":"Lihat lebih dekat","text":["Saat menjumpai arti yang terasa asing, catat dulu makna paling masuk akal, kemudian periksa kamus atau terjemahan tepercaya. Tebakan konteks adalah hipotesis belajar, bukan keputusan akhir."],"words":[]},{"heading":"Coba pikirkan lagi","text":["Kembali ke contoh utama: Anak laki-laki itu membuka pintu. Sekarang tutup terjemahannya sejenak. Sebutkan unsur yang paling penting lebih dahulu, lalu jelaskan mengapa unsur lain diperlukan. Kalau kamu bisa menunjukkan bukti pada kata Arab, pemahamanmu lebih kuat daripada sekadar mengingat terjemahan."],"words":[]},{"heading":"Bandingkan dengan pengalaman sehari-hari","text":["Dalam percakapan Indonesia pun kita tidak memahami pesan hanya dengan mengenal bunyi. Kata “rumah”, misalnya, belum memberi tahu apakah seseorang masuk, keluar, atau sedang berada di sana. Demikian juga contoh Arab di atas: unsur-unsur bekerja bersama. Keterampilan yang kita bangun adalah mengajukan pertanyaan yang tepat kepada teks, bukan menebak cerita dari satu kata yang kebetulan dikenal."],"words":[]},{"heading":"Momen aha!","text":["Sekarang kamu punya cara memeriksa diri: bukan “apakah aku bisa membaca فَتَحَ?”, melainkan “apakah aku dapat menjelaskan perannya dan hubungan dengan kata lain?” Perubahan pertanyaan kecil ini membuat latihan bahasa jauh lebih terarah."],"words":[]},{"heading":"Cara berlatih secara mandiri","text":["Buat latihan dua putaran. Pada putaran pertama, baca contoh Arab dengan tenang, tandai kata yang sudah dikenal, lalu jelaskan maknanya tanpa bantuan. Pada putaran kedua, periksa terjemahan dan bedah kata. Jika ada perbedaan, jangan langsung menghapus jawaban awalmu. Cari penyebabnya: apakah kosakatanya belum dikenal, hubungan katanya terlewat, atau kamu terlalu cepat menebak? Catatan kecil tentang kesalahanmu akan membantu latihan berikutnya."],"words":[]},{"heading":"Kesalahan yang perlu dihindari","text":["Jangan menyamakan harakat dengan terjemahan otomatis. Harakat membantu membaca dan kadang memberi petunjuk bentuk, tetapi makna kalimat tetap memerlukan kosakata dan hubungan antarunsur. Jangan pula menganggap contoh sederhana ini mewakili seluruh variasi bahasa Arab."],"words":[]},{"heading":"Latihan cepat","text":["Baca contoh baru berikut tanpa melihat jawaban:","بَابُ الْعِلْمِ","Apakah بَابٌ selalu berarti pintu bangunan?","Coba jawab dengan suara pelan atau tulis satu kalimat pendek. Pemeriksaan jawaban tersedia di bagian produksi, bukan pada halaman belajar ini."],"words":[],"answer":"Tidak. Dalam ungkapan ini بَابُ الْعِلْمِ dapat berarti pintu atau jalan menuju ilmu, bergantung konteks."},{"heading":"Pegangan hari ini","text":["Inti pelajaran “Arti Kata Tumbuh Bersama Konteks” adalah memperhatikan bukti dalam kata dan hubungannya. Kamu tidak perlu menghafal seluruh istilah hari ini; cukup dapat menunjukkan bagian yang membuat pesan menjadi masuk akal."],"words":[]},{"heading":"Lanjutkan perjalanan","text":["Setelah ini, kita beralih ke “Isim Tidak Hanya Benda”. Gunakan keterampilan hari ini sebagai bekal, bukan sebagai daftar yang harus dihafal sempurna."],"words":[]}]},{"id":"L1-S05","title":"Isim Tidak Hanya Benda","sections":[{"heading":"Mari mulai","text":["Kalau mendengar istilah isim, mungkin kamu membayangkan meja, buku, dan kursi. Padahal bahasa Arab juga memakai isim untuk nama orang, tempat, sifat, dan gagasan yang tidak bisa kita pegang."],"words":[]},{"heading":"Target belajar","text":["Setelah bagian ini, kamu dapat mengenali gagasan utama “isim tidak hanya benda”, menjelaskan fungsi unsur penting dalam contoh, dan mencoba membaca contoh baru sebelum melihat artinya."],"words":[]},{"heading":"Perhatikan kalimat ini","text":["Bacalah perlahan satu kali. Lalu tahan keinginan untuk langsung melihat terjemahan. Cari lebih dulu kata yang sudah kamu kenali, kemudian perhatikan apa yang dikatakan tentangnya.","الْعِلْمُ نَافِعٌ","Ilmu itu bermanfaat."],"words":[]},{"heading":"Bedah kata","text":["Satu kalimat menjadi lebih mudah ketika setiap bagian diberi pekerjaan yang jelas. Perhatikan bukan hanya arti Indonesianya, tetapi juga apa yang dilakukan kata tersebut dalam rangkaian."],"words":[{"arabic":"الْعِلْمُ","meaning":"ilmu","role":"isim: konsep"},{"arabic":"نَافِعٌ","meaning":"bermanfaat","role":"isim yang menyatakan sifat"}]},{"heading":"Luasnya dunia isim","text":["Nama orang seperti مُحَمَّدٌ, benda seperti كِتَابٌ, tempat seperti مَسْجِدٌ, konsep seperti عِلْمٌ, dan sifat seperti نَافِعٌ dapat termasuk isim. Karena itu jangan menerjemahkan isim sebagai “kata benda fisik” saja."],"words":[]},{"heading":"Lihat lebih dekat","text":["Bentuk dan akhiran isim akan dipelajari lebih sistematis pada level berikutnya. Untuk sekarang, kemampuan paling penting ialah mengenali bahwa sesuatu yang abstrak pun dapat menjadi topik sebuah kalimat."],"words":[]},{"heading":"Coba pikirkan lagi","text":["Kembali ke contoh utama: Ilmu itu bermanfaat. Sekarang tutup terjemahannya sejenak. Sebutkan unsur yang paling penting lebih dahulu, lalu jelaskan mengapa unsur lain diperlukan. Kalau kamu bisa menunjukkan bukti pada kata Arab, pemahamanmu lebih kuat daripada sekadar mengingat terjemahan."],"words":[]},{"heading":"Bandingkan dengan pengalaman sehari-hari","text":["Dalam percakapan Indonesia pun kita tidak memahami pesan hanya dengan mengenal bunyi. Kata “rumah”, misalnya, belum memberi tahu apakah seseorang masuk, keluar, atau sedang berada di sana. Demikian juga contoh Arab di atas: unsur-unsur bekerja bersama. Keterampilan yang kita bangun adalah mengajukan pertanyaan yang tepat kepada teks, bukan menebak cerita dari satu kata yang kebetulan dikenal."],"words":[]},{"heading":"Momen aha!","text":["Sekarang kamu punya cara memeriksa diri: bukan “apakah aku bisa membaca الْعِلْمُ?”, melainkan “apakah aku dapat menjelaskan perannya dan hubungan dengan kata lain?” Perubahan pertanyaan kecil ini membuat latihan bahasa jauh lebih terarah."],"words":[]},{"heading":"Cara berlatih secara mandiri","text":["Buat latihan dua putaran. Pada putaran pertama, baca contoh Arab dengan tenang, tandai kata yang sudah dikenal, lalu jelaskan maknanya tanpa bantuan. Pada putaran kedua, periksa terjemahan dan bedah kata. Jika ada perbedaan, jangan langsung menghapus jawaban awalmu. Cari penyebabnya: apakah kosakatanya belum dikenal, hubungan katanya terlewat, atau kamu terlalu cepat menebak? Catatan kecil tentang kesalahanmu akan membantu latihan berikutnya."],"words":[]},{"heading":"Kesalahan yang perlu dihindari","text":["Jangan menyamakan harakat dengan terjemahan otomatis. Harakat membantu membaca dan kadang memberi petunjuk bentuk, tetapi makna kalimat tetap memerlukan kosakata dan hubungan antarunsur. Jangan pula menganggap contoh sederhana ini mewakili seluruh variasi bahasa Arab."],"words":[]},{"heading":"Latihan cepat","text":["Baca contoh baru berikut tanpa melihat jawaban:","مُحَمَّدٌ فِي الْمَدْرَسَةِ","Sebutkan dua isim dalam kalimat ini.","Coba jawab dengan suara pelan atau tulis satu kalimat pendek. Pemeriksaan jawaban tersedia di bagian produksi, bukan pada halaman belajar ini."],"words":[],"answer":"مُحَمَّدٌ dan الْمَدْرَسَةِ; nama orang dan tempat."},{"heading":"Pegangan hari ini","text":["Inti pelajaran “Isim Tidak Hanya Benda” adalah memperhatikan bukti dalam kata dan hubungannya. Kamu tidak perlu menghafal seluruh istilah hari ini; cukup dapat menunjukkan bagian yang membuat pesan menjadi masuk akal."],"words":[]},{"heading":"Lanjutkan perjalanan","text":["Setelah ini, kita beralih ke “Fi‘il Membawa Cerita tentang Waktu”. Gunakan keterampilan hari ini sebagai bekal, bukan sebagai daftar yang harus dihafal sempurna."],"words":[]}]},{"id":"L1-S06","title":"Fi‘il Membawa Cerita tentang Waktu","sections":[{"heading":"Mari mulai","text":["Ada perbedaan antara mengatakan “menulis” sebagai nama kegiatan dan menyatakan seseorang sedang atau telah menulis. Bahasa Arab memiliki bentuk fi‘il yang membantu kita melihat peristiwa itu."],"words":[]},{"heading":"Target belajar","text":["Setelah bagian ini, kamu dapat mengenali gagasan utama “fi‘il membawa cerita tentang waktu”, menjelaskan fungsi unsur penting dalam contoh, dan mencoba membaca contoh baru sebelum melihat artinya."],"words":[]},{"heading":"Perhatikan kalimat ini","text":["Bacalah perlahan satu kali. Lalu tahan keinginan untuk langsung melihat terjemahan. Cari lebih dulu kata yang sudah kamu kenali, kemudian perhatikan apa yang dikatakan tentangnya.","كَتَبَ عَلِيٌّ رِسَالَةً","Ali telah menulis sebuah surat."],"words":[]},{"heading":"Bedah kata","text":["Satu kalimat menjadi lebih mudah ketika setiap bagian diberi pekerjaan yang jelas. Perhatikan bukan hanya arti Indonesianya, tetapi juga apa yang dilakukan kata tersebut dalam rangkaian."],"words":[{"arabic":"كَتَبَ","meaning":"telah menulis","role":"fi‘il lampau"},{"arabic":"عَلِيٌّ","meaning":"Ali","role":"pelaku"},{"arabic":"رِسَالَةً","meaning":"sebuah surat","role":"yang ditulis"}]},{"heading":"Waktu dan peristiwa","text":["كَتَبَ menggambarkan tindakan yang telah terjadi. يَكْتُبُ secara dasar dapat menyatakan tindakan yang sedang berlangsung atau akan berlangsung, bergantung konteks. Bentuk perintah seperti اُكْتُبْ berarti “tulislah!”. Perhatikan bahwa terjemahan waktu tidak boleh diputuskan hanya dari satu kata tanpa konteks."],"words":[]},{"heading":"Lihat lebih dekat","text":["Kata كِتَابَةٌ berarti “penulisan” dan merupakan isim, walaupun berhubungan dengan kegiatan. Ini menunjukkan bahwa arti “aktivitas” tidak otomatis membuat sebuah kata menjadi fi‘il."],"words":[]},{"heading":"Coba pikirkan lagi","text":["Kembali ke contoh utama: Ali telah menulis sebuah surat. Sekarang tutup terjemahannya sejenak. Sebutkan unsur yang paling penting lebih dahulu, lalu jelaskan mengapa unsur lain diperlukan. Kalau kamu bisa menunjukkan bukti pada kata Arab, pemahamanmu lebih kuat daripada sekadar mengingat terjemahan."],"words":[]},{"heading":"Bandingkan dengan pengalaman sehari-hari","text":["Dalam percakapan Indonesia pun kita tidak memahami pesan hanya dengan mengenal bunyi. Kata “rumah”, misalnya, belum memberi tahu apakah seseorang masuk, keluar, atau sedang berada di sana. Demikian juga contoh Arab di atas: unsur-unsur bekerja bersama. Keterampilan yang kita bangun adalah mengajukan pertanyaan yang tepat kepada teks, bukan menebak cerita dari satu kata yang kebetulan dikenal."],"words":[]},{"heading":"Momen aha!","text":["Sekarang kamu punya cara memeriksa diri: bukan “apakah aku bisa membaca كَتَبَ?”, melainkan “apakah aku dapat menjelaskan perannya dan hubungan dengan kata lain?” Perubahan pertanyaan kecil ini membuat latihan bahasa jauh lebih terarah."],"words":[]},{"heading":"Cara berlatih secara mandiri","text":["Buat latihan dua putaran. Pada putaran pertama, baca contoh Arab dengan tenang, tandai kata yang sudah dikenal, lalu jelaskan maknanya tanpa bantuan. Pada putaran kedua, periksa terjemahan dan bedah kata. Jika ada perbedaan, jangan langsung menghapus jawaban awalmu. Cari penyebabnya: apakah kosakatanya belum dikenal, hubungan katanya terlewat, atau kamu terlalu cepat menebak? Catatan kecil tentang kesalahanmu akan membantu latihan berikutnya."],"words":[]},{"heading":"Kesalahan yang perlu dihindari","text":["Jangan menyamakan harakat dengan terjemahan otomatis. Harakat membantu membaca dan kadang memberi petunjuk bentuk, tetapi makna kalimat tetap memerlukan kosakata dan hubungan antarunsur. Jangan pula menganggap contoh sederhana ini mewakili seluruh variasi bahasa Arab."],"words":[]},{"heading":"Latihan cepat","text":["Baca contoh baru berikut tanpa melihat jawaban:","يَكْتُبُ عَلِيٌّ","Apa perbedaan dengan كَتَبَ عَلِيٌّ?","Coba jawab dengan suara pelan atau tulis satu kalimat pendek. Pemeriksaan jawaban tersedia di bagian produksi, bukan pada halaman belajar ini."],"words":[],"answer":"يَكْتُبُ dapat berarti Ali sedang menulis atau akan menulis menurut konteks; كَتَبَ menyatakan tindakan yang telah terjadi."},{"heading":"Pegangan hari ini","text":["Inti pelajaran “Fi‘il Membawa Cerita tentang Waktu” adalah memperhatikan bukti dalam kata dan hubungannya. Kamu tidak perlu menghafal seluruh istilah hari ini; cukup dapat menunjukkan bagian yang membuat pesan menjadi masuk akal."],"words":[]},{"heading":"Lanjutkan perjalanan","text":["Setelah ini, kita beralih ke “Kata Kecil yang Mengubah Arah”. Gunakan keterampilan hari ini sebagai bekal, bukan sebagai daftar yang harus dihafal sempurna."],"words":[]}]},{"id":"L1-S07","title":"Kata Kecil yang Mengubah Arah","sections":[{"heading":"Mari mulai","text":["Coba bayangkan ada seseorang di depan rumah, lalu ia masuk ke rumah. Tempatnya sama, tetapi hubungannya berbeda. Dalam bahasa Arab, kata kecil sering membawa perbedaan besar itu."],"words":[]},{"heading":"Target belajar","text":["Setelah bagian ini, kamu dapat mengenali gagasan utama “kata kecil yang mengubah arah”, menjelaskan fungsi unsur penting dalam contoh, dan mencoba membaca contoh baru sebelum melihat artinya."],"words":[]},{"heading":"Perhatikan kalimat ini","text":["Bacalah perlahan satu kali. Lalu tahan keinginan untuk langsung melihat terjemahan. Cari lebih dulu kata yang sudah kamu kenali, kemudian perhatikan apa yang dikatakan tentangnya.","الْكِتَابُ عَلَى الْمَكْتَبِ","Buku itu berada di atas meja."],"words":[]},{"heading":"Bedah kata","text":["Satu kalimat menjadi lebih mudah ketika setiap bagian diberi pekerjaan yang jelas. Perhatikan bukan hanya arti Indonesianya, tetapi juga apa yang dilakukan kata tersebut dalam rangkaian."],"words":[{"arabic":"الْكِتَابُ","meaning":"buku itu","role":"benda yang dibicarakan"},{"arabic":"عَلَى","meaning":"di atas","role":"huruf hubungan tempat"},{"arabic":"الْمَكْتَبِ","meaning":"meja","role":"tempat acuan"}]},{"heading":"Hubungan yang kecil tetapi penting","text":["عَلَى dalam contoh menempatkan buku di atas meja. Jika diganti فِي, hubungan yang disampaikan menjadi “di dalam”. Huruf seperti مِنْ dapat menunjukkan asal, إِلَى tujuan, dan بِـ dapat memiliki beberapa fungsi sesuai konteks."],"words":[]},{"heading":"Lihat lebih dekat","text":["Huruf ma‘ani bukan huruf hijaiyah. Huruf hijaiyah adalah lambang bunyi seperti ب dan ت; huruf ma‘ani merupakan unsur bahasa yang membantu membangun hubungan makna."],"words":[]},{"heading":"Coba pikirkan lagi","text":["Kembali ke contoh utama: Buku itu berada di atas meja. Sekarang tutup terjemahannya sejenak. Sebutkan unsur yang paling penting lebih dahulu, lalu jelaskan mengapa unsur lain diperlukan. Kalau kamu bisa menunjukkan bukti pada kata Arab, pemahamanmu lebih kuat daripada sekadar mengingat terjemahan."],"words":[]},{"heading":"Bandingkan dengan pengalaman sehari-hari","text":["Dalam percakapan Indonesia pun kita tidak memahami pesan hanya dengan mengenal bunyi. Kata “rumah”, misalnya, belum memberi tahu apakah seseorang masuk, keluar, atau sedang berada di sana. Demikian juga contoh Arab di atas: unsur-unsur bekerja bersama. Keterampilan yang kita bangun adalah mengajukan pertanyaan yang tepat kepada teks, bukan menebak cerita dari satu kata yang kebetulan dikenal."],"words":[]},{"heading":"Momen aha!","text":["Sekarang kamu punya cara memeriksa diri: bukan “apakah aku bisa membaca الْكِتَابُ?”, melainkan “apakah aku dapat menjelaskan perannya dan hubungan dengan kata lain?” Perubahan pertanyaan kecil ini membuat latihan bahasa jauh lebih terarah."],"words":[]},{"heading":"Cara berlatih secara mandiri","text":["Buat latihan dua putaran. Pada putaran pertama, baca contoh Arab dengan tenang, tandai kata yang sudah dikenal, lalu jelaskan maknanya tanpa bantuan. Pada putaran kedua, periksa terjemahan dan bedah kata. Jika ada perbedaan, jangan langsung menghapus jawaban awalmu. Cari penyebabnya: apakah kosakatanya belum dikenal, hubungan katanya terlewat, atau kamu terlalu cepat menebak? Catatan kecil tentang kesalahanmu akan membantu latihan berikutnya."],"words":[]},{"heading":"Kesalahan yang perlu dihindari","text":["Jangan menyamakan harakat dengan terjemahan otomatis. Harakat membantu membaca dan kadang memberi petunjuk bentuk, tetapi makna kalimat tetap memerlukan kosakata dan hubungan antarunsur. Jangan pula menganggap contoh sederhana ini mewakili seluruh variasi bahasa Arab."],"words":[]},{"heading":"Latihan cepat","text":["Baca contoh baru berikut tanpa melihat jawaban:","الْكِتَابُ فِي الْحَقِيبَةِ","Apa makna فِي di sini?","Coba jawab dengan suara pelan atau tulis satu kalimat pendek. Pemeriksaan jawaban tersedia di bagian produksi, bukan pada halaman belajar ini."],"words":[],"answer":"Di dalam; buku itu berada di dalam tas."},{"heading":"Pegangan hari ini","text":["Inti pelajaran “Kata Kecil yang Mengubah Arah” adalah memperhatikan bukti dalam kata dan hubungannya. Kamu tidak perlu menghafal seluruh istilah hari ini; cukup dapat menunjukkan bagian yang membuat pesan menjadi masuk akal."],"words":[]},{"heading":"Lanjutkan perjalanan","text":["Setelah ini, kita beralih ke “Susunan Kata Menunjukkan Peran”. Gunakan keterampilan hari ini sebagai bekal, bukan sebagai daftar yang harus dihafal sempurna."],"words":[]}]},{"id":"L1-S08","title":"Susunan Kata Menunjukkan Peran","sections":[{"heading":"Mari mulai","text":["Dua orang bisa muncul dalam satu kalimat, tetapi kita tetap perlu tahu siapa melakukan tindakan dan siapa menerima tindakan itu. Di sinilah susunan dan tanda kata membantu."],"words":[]},{"heading":"Target belajar","text":["Setelah bagian ini, kamu dapat mengenali gagasan utama “susunan kata menunjukkan peran”, menjelaskan fungsi unsur penting dalam contoh, dan mencoba membaca contoh baru sebelum melihat artinya."],"words":[]},{"heading":"Perhatikan kalimat ini","text":["Bacalah perlahan satu kali. Lalu tahan keinginan untuk langsung melihat terjemahan. Cari lebih dulu kata yang sudah kamu kenali, kemudian perhatikan apa yang dikatakan tentangnya.","كَتَبَ الْمُعَلِّمُ الدَّرْسَ","Guru itu telah menulis pelajaran."],"words":[]},{"heading":"Bedah kata","text":["Satu kalimat menjadi lebih mudah ketika setiap bagian diberi pekerjaan yang jelas. Perhatikan bukan hanya arti Indonesianya, tetapi juga apa yang dilakukan kata tersebut dalam rangkaian."],"words":[{"arabic":"كَتَبَ","meaning":"telah menulis","role":"tindakan"},{"arabic":"الْمُعَلِّمُ","meaning":"guru itu","role":"pelaku"},{"arabic":"الدَّرْسَ","meaning":"pelajaran","role":"yang ditulis"}]},{"heading":"Jangan terjebak urutan terjemahan","text":["Dalam contoh, kita menemukan tindakan, pelaku, lalu sesuatu yang dikenai tindakan. Bahasa Indonesia dapat menyusun informasi yang sama dengan kebiasaan berbeda. Karena itu, urutan kata Arab perlu dibaca bersama petunjuk bentuk dan harakat."],"words":[]},{"heading":"Lihat lebih dekat","text":["Jangan menyimpulkan bahwa setiap kalimat Arab wajib dimulai fi‘il. Ada juga susunan yang dimulai isim, seperti الْمُعَلِّمُ حَاضِرٌ. Pembahasan kaidah lengkapnya datang kemudian."],"words":[]},{"heading":"Coba pikirkan lagi","text":["Kembali ke contoh utama: Guru itu telah menulis pelajaran. Sekarang tutup terjemahannya sejenak. Sebutkan unsur yang paling penting lebih dahulu, lalu jelaskan mengapa unsur lain diperlukan. Kalau kamu bisa menunjukkan bukti pada kata Arab, pemahamanmu lebih kuat daripada sekadar mengingat terjemahan."],"words":[]},{"heading":"Bandingkan dengan pengalaman sehari-hari","text":["Dalam percakapan Indonesia pun kita tidak memahami pesan hanya dengan mengenal bunyi. Kata “rumah”, misalnya, belum memberi tahu apakah seseorang masuk, keluar, atau sedang berada di sana. Demikian juga contoh Arab di atas: unsur-unsur bekerja bersama. Keterampilan yang kita bangun adalah mengajukan pertanyaan yang tepat kepada teks, bukan menebak cerita dari satu kata yang kebetulan dikenal."],"words":[]},{"heading":"Momen aha!","text":["Sekarang kamu punya cara memeriksa diri: bukan “apakah aku bisa membaca كَتَبَ?”, melainkan “apakah aku dapat menjelaskan perannya dan hubungan dengan kata lain?” Perubahan pertanyaan kecil ini membuat latihan bahasa jauh lebih terarah."],"words":[]},{"heading":"Cara berlatih secara mandiri","text":["Buat latihan dua putaran. Pada putaran pertama, baca contoh Arab dengan tenang, tandai kata yang sudah dikenal, lalu jelaskan maknanya tanpa bantuan. Pada putaran kedua, periksa terjemahan dan bedah kata. Jika ada perbedaan, jangan langsung menghapus jawaban awalmu. Cari penyebabnya: apakah kosakatanya belum dikenal, hubungan katanya terlewat, atau kamu terlalu cepat menebak? Catatan kecil tentang kesalahanmu akan membantu latihan berikutnya."],"words":[]},{"heading":"Kesalahan yang perlu dihindari","text":["Jangan menyamakan harakat dengan terjemahan otomatis. Harakat membantu membaca dan kadang memberi petunjuk bentuk, tetapi makna kalimat tetap memerlukan kosakata dan hubungan antarunsur. Jangan pula menganggap contoh sederhana ini mewakili seluruh variasi bahasa Arab."],"words":[]},{"heading":"Latihan cepat","text":["Baca contoh baru berikut tanpa melihat jawaban:","قَرَأَ الطَّالِبُ الدَّرْسَ","Siapa membaca apa?","Coba jawab dengan suara pelan atau tulis satu kalimat pendek. Pemeriksaan jawaban tersedia di bagian produksi, bukan pada halaman belajar ini."],"words":[],"answer":"Murid itu membaca pelajaran; الطَّالِبُ pelaku dan الدَّرْسَ yang dibaca."},{"heading":"Pegangan hari ini","text":["Inti pelajaran “Susunan Kata Menunjukkan Peran” adalah memperhatikan bukti dalam kata dan hubungannya. Kamu tidak perlu menghafal seluruh istilah hari ini; cukup dapat menunjukkan bagian yang membuat pesan menjadi masuk akal."],"words":[]},{"heading":"Lanjutkan perjalanan","text":["Setelah ini, kita beralih ke “Menangkap Pesan Kalimat Pendek”. Gunakan keterampilan hari ini sebagai bekal, bukan sebagai daftar yang harus dihafal sempurna."],"words":[]}]},{"id":"L1-S09","title":"Menangkap Pesan Kalimat Pendek","sections":[{"heading":"Mari mulai","text":["Sekarang kita tidak lagi membaca kata secara terpisah. Kita mulai menggabungkan petunjuk: siapa, melakukan apa, dan di mana. Dengan cara ini, satu kalimat pendek terasa seperti cerita kecil."],"words":[]},{"heading":"Target belajar","text":["Setelah bagian ini, kamu dapat mengenali gagasan utama “menangkap pesan kalimat pendek”, menjelaskan fungsi unsur penting dalam contoh, dan mencoba membaca contoh baru sebelum melihat artinya."],"words":[]},{"heading":"Perhatikan kalimat ini","text":["Bacalah perlahan satu kali. Lalu tahan keinginan untuk langsung melihat terjemahan. Cari lebih dulu kata yang sudah kamu kenali, kemudian perhatikan apa yang dikatakan tentangnya.","يَجْلِسُ الْأَبُ فِي الْبَيْتِ","Ayah duduk di rumah."],"words":[]},{"heading":"Bedah kata","text":["Satu kalimat menjadi lebih mudah ketika setiap bagian diberi pekerjaan yang jelas. Perhatikan bukan hanya arti Indonesianya, tetapi juga apa yang dilakukan kata tersebut dalam rangkaian."],"words":[{"arabic":"يَجْلِسُ","meaning":"sedang duduk / duduk","role":"peristiwa"},{"arabic":"الْأَبُ","meaning":"ayah","role":"pelaku"},{"arabic":"فِي","meaning":"di","role":"hubungan tempat"},{"arabic":"الْبَيْتِ","meaning":"rumah","role":"tempat"}]},{"heading":"Tiga pertanyaan praktis","text":["Tanyakan: siapa atau apa yang sedang dibicarakan? Apa informasi atau tindakan utamanya? Apakah ada keterangan tambahan seperti tempat atau tujuan? Pertanyaan ini mengubah kegiatan membaca dari sekadar menyebut bunyi menjadi memahami isi."],"words":[]},{"heading":"Lihat lebih dekat","text":["Ketika kamu menemukan يَجْلِسُ, jangan otomatis menambah “sedang” jika konteks tidak memerlukannya. Dalam bahasa Indonesia, “ayah duduk di rumah” sering lebih alami daripada terjemahan yang terlalu harfiah."],"words":[]},{"heading":"Coba pikirkan lagi","text":["Kembali ke contoh utama: Ayah duduk di rumah. Sekarang tutup terjemahannya sejenak. Sebutkan unsur yang paling penting lebih dahulu, lalu jelaskan mengapa unsur lain diperlukan. Kalau kamu bisa menunjukkan bukti pada kata Arab, pemahamanmu lebih kuat daripada sekadar mengingat terjemahan."],"words":[]},{"heading":"Bandingkan dengan pengalaman sehari-hari","text":["Dalam percakapan Indonesia pun kita tidak memahami pesan hanya dengan mengenal bunyi. Kata “rumah”, misalnya, belum memberi tahu apakah seseorang masuk, keluar, atau sedang berada di sana. Demikian juga contoh Arab di atas: unsur-unsur bekerja bersama. Keterampilan yang kita bangun adalah mengajukan pertanyaan yang tepat kepada teks, bukan menebak cerita dari satu kata yang kebetulan dikenal."],"words":[]},{"heading":"Momen aha!","text":["Sekarang kamu punya cara memeriksa diri: bukan “apakah aku bisa membaca يَجْلِسُ?”, melainkan “apakah aku dapat menjelaskan perannya dan hubungan dengan kata lain?” Perubahan pertanyaan kecil ini membuat latihan bahasa jauh lebih terarah."],"words":[]},{"heading":"Cara berlatih secara mandiri","text":["Buat latihan dua putaran. Pada putaran pertama, baca contoh Arab dengan tenang, tandai kata yang sudah dikenal, lalu jelaskan maknanya tanpa bantuan. Pada putaran kedua, periksa terjemahan dan bedah kata. Jika ada perbedaan, jangan langsung menghapus jawaban awalmu. Cari penyebabnya: apakah kosakatanya belum dikenal, hubungan katanya terlewat, atau kamu terlalu cepat menebak? Catatan kecil tentang kesalahanmu akan membantu latihan berikutnya."],"words":[]},{"heading":"Kesalahan yang perlu dihindari","text":["Jangan menyamakan harakat dengan terjemahan otomatis. Harakat membantu membaca dan kadang memberi petunjuk bentuk, tetapi makna kalimat tetap memerlukan kosakata dan hubungan antarunsur. Jangan pula menganggap contoh sederhana ini mewakili seluruh variasi bahasa Arab."],"words":[]},{"heading":"Latihan cepat","text":["Baca contoh baru berikut tanpa melihat jawaban:","تَذْهَبُ الْبِنْتُ إِلَى الْمَدْرَسَةِ","Ke mana anak perempuan itu pergi?","Coba jawab dengan suara pelan atau tulis satu kalimat pendek. Pemeriksaan jawaban tersedia di bagian produksi, bukan pada halaman belajar ini."],"words":[],"answer":"Ke sekolah; إِلَى الْمَدْرَسَةِ menyatakan tujuan."},{"heading":"Pegangan hari ini","text":["Inti pelajaran “Menangkap Pesan Kalimat Pendek” adalah memperhatikan bukti dalam kata dan hubungannya. Kamu tidak perlu menghafal seluruh istilah hari ini; cukup dapat menunjukkan bagian yang membuat pesan menjadi masuk akal."],"words":[]},{"heading":"Lanjutkan perjalanan","text":["Setelah ini, kita beralih ke “Dari Satu Kalimat ke Sebuah Cerita”. Gunakan keterampilan hari ini sebagai bekal, bukan sebagai daftar yang harus dihafal sempurna."],"words":[]}]},{"id":"L1-S10","title":"Dari Satu Kalimat ke Sebuah Cerita","sections":[{"heading":"Mari mulai","text":["Ini tantangan penutup level pertama: membaca beberapa kalimat berharakat tanpa segera mencari terjemahan. Kamu sudah punya alatnya—mengenali kata, peran, dan hubungan."],"words":[]},{"heading":"Target belajar","text":["Setelah bagian ini, kamu dapat mengenali gagasan utama “dari satu kalimat ke sebuah cerita”, menjelaskan fungsi unsur penting dalam contoh, dan mencoba membaca contoh baru sebelum melihat artinya."],"words":[]},{"heading":"Perhatikan kalimat ini","text":["Bacalah perlahan satu kali. Lalu tahan keinginan untuk langsung melihat terjemahan. Cari lebih dulu kata yang sudah kamu kenali, kemudian perhatikan apa yang dikatakan tentangnya.","دَخَلَ أَحْمَدُ الْمَسْجِدَ. جَلَسَ أَحْمَدُ. قَرَأَ الْقُرْآنَ.","Ahmad masuk ke masjid. Ahmad duduk. Ia membaca Al-Qur’an."],"words":[]},{"heading":"Bedah kata","text":["Satu kalimat menjadi lebih mudah ketika setiap bagian diberi pekerjaan yang jelas. Perhatikan bukan hanya arti Indonesianya, tetapi juga apa yang dilakukan kata tersebut dalam rangkaian."],"words":[{"arabic":"دَخَلَ","meaning":"telah masuk","role":"peristiwa pertama"},{"arabic":"أَحْمَدُ","meaning":"Ahmad","role":"tokoh"},{"arabic":"جَلَسَ","meaning":"telah duduk","role":"peristiwa kedua"},{"arabic":"قَرَأَ","meaning":"telah membaca","role":"peristiwa ketiga"}]},{"heading":"Mengikuti alur","text":["Teks pendek ini menyajikan tiga kejadian yang berurutan. Ahmad masuk, kemudian duduk, kemudian membaca. Nama Ahmad disebut ulang pada kalimat kedua; pada kalimat ketiga pelaku dapat dipahami dari rangkaian dan bentuk kalimat."],"words":[]},{"heading":"Lihat lebih dekat","text":["Tujuan kita bukan menerjemahkan setiap unsur secara kaku, melainkan menangkap cerita secara utuh. Ketika ada satu kata belum dikenal, lihat kalimat sebelum dan sesudahnya sebelum membuka bantuan terjemahan."],"words":[]},{"heading":"Coba pikirkan lagi","text":["Kembali ke contoh utama: Ahmad masuk ke masjid. Ahmad duduk. Ia membaca Al-Qur’an. Sekarang tutup terjemahannya sejenak. Sebutkan unsur yang paling penting lebih dahulu, lalu jelaskan mengapa unsur lain diperlukan. Kalau kamu bisa menunjukkan bukti pada kata Arab, pemahamanmu lebih kuat daripada sekadar mengingat terjemahan."],"words":[]},{"heading":"Bandingkan dengan pengalaman sehari-hari","text":["Dalam percakapan Indonesia pun kita tidak memahami pesan hanya dengan mengenal bunyi. Kata “rumah”, misalnya, belum memberi tahu apakah seseorang masuk, keluar, atau sedang berada di sana. Demikian juga contoh Arab di atas: unsur-unsur bekerja bersama. Keterampilan yang kita bangun adalah mengajukan pertanyaan yang tepat kepada teks, bukan menebak cerita dari satu kata yang kebetulan dikenal."],"words":[]},{"heading":"Momen aha!","text":["Sekarang kamu punya cara memeriksa diri: bukan “apakah aku bisa membaca دَخَلَ?”, melainkan “apakah aku dapat menjelaskan perannya dan hubungan dengan kata lain?” Perubahan pertanyaan kecil ini membuat latihan bahasa jauh lebih terarah."],"words":[]},{"heading":"Cara berlatih secara mandiri","text":["Buat latihan dua putaran. Pada putaran pertama, baca contoh Arab dengan tenang, tandai kata yang sudah dikenal, lalu jelaskan maknanya tanpa bantuan. Pada putaran kedua, periksa terjemahan dan bedah kata. Jika ada perbedaan, jangan langsung menghapus jawaban awalmu. Cari penyebabnya: apakah kosakatanya belum dikenal, hubungan katanya terlewat, atau kamu terlalu cepat menebak? Catatan kecil tentang kesalahanmu akan membantu latihan berikutnya."],"words":[]},{"heading":"Kesalahan yang perlu dihindari","text":["Jangan menyamakan harakat dengan terjemahan otomatis. Harakat membantu membaca dan kadang memberi petunjuk bentuk, tetapi makna kalimat tetap memerlukan kosakata dan hubungan antarunsur. Jangan pula menganggap contoh sederhana ini mewakili seluruh variasi bahasa Arab."],"words":[]},{"heading":"Latihan cepat","text":["Baca contoh baru berikut tanpa melihat jawaban:","دَخَلَتْ فَاطِمَةُ الْبَيْتَ. جَلَسَتْ.","Apa urutan kejadian?","Coba jawab dengan suara pelan atau tulis satu kalimat pendek. Pemeriksaan jawaban tersedia di bagian produksi, bukan pada halaman belajar ini."],"words":[],"answer":"Fatimah masuk ke rumah, kemudian duduk; pelaku kalimat kedua dipahami dari bentuk fi‘il dan konteks."},{"heading":"Pegangan hari ini","text":["Inti pelajaran “Dari Satu Kalimat ke Sebuah Cerita” adalah memperhatikan bukti dalam kata dan hubungannya. Kamu tidak perlu menghafal seluruh istilah hari ini; cukup dapat menunjukkan bagian yang membuat pesan menjadi masuk akal."],"words":[]},{"heading":"Siap menuju Level 02","text":["Jika kamu sudah dapat membaca teks berharakat dan menceritakan kembali maksudnya, kamu siap mempelajari identitas isim lebih teliti pada Level 02."],"words":[]}]}];
function nwEscape(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nwArabic(t){return `<span class="nw-arab-inline" lang="ar" dir="rtl">${nwEscape(t)}</span>`;}
function nwRich(t){return nwEscape(t).replace(/(\p{Script=Arabic}[\p{Script=Arabic}\p{Mark}\s]*)/gu,(v)=>`<span class="nw-arab-inline" dir="rtl" lang="ar">${v}</span>`);}
function nwSec(lesson,title){return lesson.sections.find(x=>x.heading===title)||{text:[],words:[]};}
function nwPara(s){return (s.text||[]).map(t=>`<p>${nwRich(t)}</p>`).join('');}
function nwMainExample(s){const v=s.text||[];return `<div class="nw-card nw-example"><div class="nw-card-title">✦ Perhatikan contoh</div><p class="nw-small">${nwRich(v[0]||'')}</p><div class="nw-arab-stage" lang="ar" dir="rtl">${nwEscape(v[1]||'')}</div><p class="nw-translation">${nwEscape(v[2]||'')}</p></div>`;}
function nwWordCards(s){return `<section class="nw-card nw-breakdown"><h3>🔎 Bedah kata</h3><p class="nw-small">Perhatikan makna dan tugas setiap kata dalam kalimat.</p><div class="nw-words">${(s.words||[]).map(w=>`<div class="nw-word-row"><div class="nw-word-ar" lang="ar" dir="rtl">${nwEscape(w.arabic)}</div><div class="nw-word-desc"><strong>${nwEscape(w.meaning)}</strong><small>${nwEscape(w.role)}</small></div></div>`).join('')}</div></section>`;}
function nwQuiz(s){let a=s.text||[];let ar=a.find(x=>/[\u0600-\u06FF]/.test(x))||'';let q=a.find((x,i)=>i>0&&x.includes('?'))||a[a.length-2]||'';let answer=s.answer||'';return `<section class="nw-card nw-quiz"><div class="nw-card-title">🧠 Uji pemahamanmu</div><p class="nw-small">Coba jawab sebelum membuka pembahasannya.</p><div class="nw-arab-stage" lang="ar" dir="rtl">${nwEscape(ar)}</div><p class="nw-question">${nwRich(q)}</p><details><summary>Lihat jawaban & penjelasan</summary><div class="nw-answer">${nwRich(answer||'Jawaban akan ditambahkan setelah pemeriksaan materi.')}</div></details></section>`;}
function nahwooLessonMarkup(index){const l=NAHWOO_LEVEL1_V2[index];if(!l)return '';const sec=n=>nwSec(l,n);
const core=l.sections.find(x=>!['Mari mulai','Target belajar','Perhatikan kalimat ini','Bedah kata','Lihat lebih dekat','Coba pikirkan lagi','Bandingkan dengan pengalaman sehari-hari','Momen aha!','Cara berlatih secara mandiri','Kesalahan yang perlu dihindari','Latihan cepat','Pegangan hari ini','Lanjutkan perjalanan','Siap menuju Level 02'].includes(x.heading));
let out=[`<div class="nw-target"><div class="nw-card-title">🎯 Target belajar</div><p>${nwRich((sec('Target belajar').text||[])[0]||'')}</p></div>`,`<section class="nw-hook"><h2>Pernah terpikir?</h2>${nwPara(sec('Mari mulai'))}</section>`,nwMainExample(sec('Perhatikan kalimat ini')),nwWordCards(sec('Bedah kata'))];
if(core)out.push(`<section class="nw-story"><h2>${nwEscape(core.heading)}</h2>${nwPara(core)}</section>`);
const detail=sec('Lihat lebih dekat');if(detail.text.length)out.push(`<div class="nw-card nw-detail"><div class="nw-card-title">🔍 Lihat lebih dekat</div>${nwPara(detail)}</div>`);
const insight=sec('Momen aha!');if(insight.text.length)out.push(`<div class="nw-card nw-insight"><div class="nw-card-title">💡 Aha! Sekarang terlihat</div>${nwPara(insight)}</div>`);
const contrast=sec('Bandingkan dengan pengalaman sehari-hari');if(contrast.text.length)out.push(`<section class="nw-story"><h2>Hubungkan dengan kehidupan</h2>${nwPara(contrast)}</section>`);
const warning=sec('Kesalahan yang perlu dihindari');if(warning.text.length)out.push(`<div class="nw-card nw-warning"><div class="nw-card-title">⚠️ Jangan sampai keliru</div>${nwPara(warning)}</div>`);
const practice=sec('Cara berlatih secara mandiri');if(practice.text.length)out.push(`<details class="nw-card nw-practice"><summary>📖 Cara berlatih mandiri</summary>${nwPara(practice)}</details>`);
out.push(nwQuiz(sec('Latihan cepat')));
const takeaway=sec('Pegangan hari ini');if(takeaway.text.length)out.push(`<div class="nw-card nw-takeaway"><div class="nw-card-title">⭐ Pegangan hari ini</div>${nwPara(takeaway)}</div>`);
const next=sec('Lanjutkan perjalanan').text.length?sec('Lanjutkan perjalanan'):sec('Siap menuju Level 02');if(next.text.length)out.push(`<div class="nw-next"><div class="nw-card-title">→ Berikutnya</div>${nwPara(next)}</div>`);
return `<div class="nw-reader">${out.join('')}</div>`;
}
</script></body></html>
