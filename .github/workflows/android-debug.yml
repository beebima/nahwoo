name: Build Nahwoo Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # N-016: block a build if Markdown ** markers would leak in rendered lessons.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: QA rich-text formatting across 24 levels
        run: node scripts/qa-richtext.js
      - name: QA Mufradat Beranda fixed frame and smooth rotation
        run: node scripts/qa-home-vocab.js
      - name: QA partial mufradat RUN03 and RUN08 imports
        run: node scripts/qa-mufradat-partial.js
      - name: QA V4 Reading-First replacement Level 01–08
        run: node scripts/qa-v4-level01-08.js
      - name: QA V4 source text and answer parity
        run: node scripts/qa-v4-source-parity.js
      - name: QA Premium Smart Reader semantics
        run: node scripts/qa-v4-reader-semantics.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted ubuntu-latest includes Android SDK; avoid setup-android
      # default package "tools", which is no longer available.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || (echo 'Android SDK missing' && exit 1)
          ls "$ANDROID_HOME/platforms" || true
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      # N-017: artifact label must reflect the current Gradle versionName.
      - name: Read Android version for artifact label
        id: appversion
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: nahwoo-v${{ steps.appversion.outputs.value }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
