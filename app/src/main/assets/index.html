.nwx-reader .nwx-word-desc{line-height:1.55;font-size:calc(var(--latin-size,16px) * .86)}
.nwx-reader .nwx-practice{--nwx-bg:#F1EDFF;--nwx-border:#D3C5EC;--nwx-accent:#614594;background:#F1EDFF!important;border-color:#D3C5EC!important}
.nwx-reader .nwx-warning{--nwx-bg:#FFF0EE;--nwx-border:#ECC4BE;--nwx-accent:#9E493D;background:#FFF0EE!important;border-color:#ECC4BE!important}
.nwx-reader .nwx-takeaway{--nwx-bg:#E7EEFF;--nwx-border:#CBDCF9;--nwx-accent:#245DD1;background:#E7EEFF!important;border-color:#CBDCF9!important;border-left:4px solid #245DD1!important}
.nwx-reader .nwx-takeaway .nw-quote{background:transparent!important;border:0!important;margin:0!important;padding:1px 0!important}
.nwx-reader .nwx-takeaway .nw-quote-text{font-size:calc(var(--latin-size,16px) * 1.12)!important;line-height:1.55!important;color:#223F75!important;font-weight:750}
.nwx-reader details.nwx-quick-answer{padding-top:7px;margin-top:7px;border-top:1px dashed var(--nwx-border);min-width:0}
.nwx-reader details.nwx-quick-answer summary{cursor:pointer;color:var(--nwx-accent);font-weight:750;font-size:calc(var(--latin-size,16px) * .88)}
.nwx-reader details.nwx-quick-answer .nw-body-block{margin-top:9px!important}
.nwx-reader .nwx-card .nw-quiz{background:transparent!important;border:0!important;padding:0!important}
.dark .nwx-reader .nwx-card{color:var(--ink);background:var(--surface)!important}
.dark .nwx-reader .nwx-target{--nwx-accent:#f7d489;--nwx-border:#786038;background:#3b3327!important;border-color:#786038!important}
.dark .nwx-reader .nwx-example{--nwx-accent:#a3c1ff;--nwx-border:#435d88;background:#1d304e!important;border-color:#435d88!important}
.dark .nwx-reader .nwx-breakdown,.dark .nwx-reader .nwx-compare{--nwx-accent:#9fe1bc;--nwx-border:#3d7059;background:#1c3b31!important;border-color:#3d7059!important}
.dark .nwx-reader .nwx-practice{--nwx-accent:#d5c0ff;--nwx-border:#665582;background:#302b47!important;border-color:#665582!important}
.dark .nwx-reader .nwx-warning{--nwx-accent:#ffb8b1;--nwx-border:#8c5b52;background:#442e32!important;border-color:#8c5b52!important}
.dark .nwx-reader .nwx-takeaway{--nwx-accent:#a3c1ff;--nwx-border:#435d88;background:#203450!important;border-color:#435d88!important;border-left-color:#89aeff!important}
.dark .nwx-reader .nwx-target-item{color:#f1dfba}
.dark .nwx-reader .nwx-example .nw-arab-stage+.nw-body-block p{color:#b6d0ff}
.dark .nwx-reader .nwx-word-tile{background:#213f32;border-color:#51765e}
.dark .nwx-reader .nwx-takeaway .nw-quote-text{color:#d9e6ff!important}
.dark .nwx-reader .nwx-flow>.nw-subheading-block{color:#8DB4FF!important}
@media(max-width:380px){.nwx-reader{gap:13px}.nwx-reader .nwx-card{padding:13px 11px}.nwx-reader .nwx-card-head{gap:7px}.nwx-reader .nwx-word-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,115px),1fr))}}

/* V4 heading default around 24px while preserving user heading-size preferences */
.nw-v4-main-heading{font-size:clamp(21px,calc(var(--heading-size,28px) * .86),42px)!important;color:#192e4f!important;line-height:1.35!important;margin:5px 0 18px!important}
.dark .nw-v4-main-heading{color:#E9F0FF!important}
/* V0.1.8.14: grammatical comparisons are analysis (green), not practice (purple). */
.nwx-reader .nwx-compare{--nwx-bg:#EDF8F1;--nwx-border:#B9DFC9;--nwx-accent:#24694C;background:#EDF8F1!important;border-color:#B9DFC9!important}
.dark .nwx-reader .nwx-compare{--nwx-bg:#1D3930;--nwx-border:#47705C;--nwx-accent:#9BE0BE;background:#1D3930!important;border-color:#47705C!important}
.nwx-reader .nwx-target .nwx-target-item{min-width:0}
.nwx-reader .nwx-target .nw-body-block p{line-height:1.65!important}
.nwx-reader .nwx-quick-question{margin-top:13px}
.nwx-reader .nwx-quick-question .nw-subheading-block{margin:0!important;color:#7152AE!important}
.nwx-reader .nwx-quick-question p{margin:0!important}
.nwx-reader .nwx-quick-question .nwx-quick-answer{margin-top:11px}
/* Leave the whole number grid visible below the fixed demo banner. */
.nw-eval-numbers#nw-eval-number-grid{scroll-margin-top:calc(var(--demo-ad-height,50px) + 12px)!important}
body.demo-no-ads .nw-eval-numbers#nw-eval-number-grid{scroll-margin-top:12px!important}

function nwHomeLockFrame(){

function nwHomeFitWord(card){
 const holder=(card||document.querySelector('.home-vocab'))?.querySelector('.nw-home-word-body');
 if(!holder||holder.clientHeight<1)return;
 const arab=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--arabic-size'))||45;
 const base={word:Math.min(38,arab*.9),meaning:12,kind:10,example:Math.min(32,arab*.73),translation:10};
 // Sizes are adjusted only inside this card; user reader font settings are not overwritten.
 for(let i=0;i<22;i++){
   const f=Math.pow(.936,i);
   holder.style.setProperty('--nw-home-word-ar-size',Math.max(14,base.word*f).toFixed(2)+'px');
   holder.style.setProperty('--nw-home-meaning-size',Math.max(8,base.meaning*f).toFixed(2)+'px');
   holder.style.setProperty('--nw-home-kind-size',Math.max(7,base.kind*f).toFixed(2)+'px');
   holder.style.setProperty('--nw-home-example-ar-size',Math.max(13,base.example*f).toFixed(2)+'px');
   holder.style.setProperty('--nw-home-example-translation-size',Math.max(8,base.translation*f).toFixed(2)+'px');
   if(holder.scrollHeight<=holder.clientHeight+1 && holder.scrollWidth<=holder.clientWidth+1)break;
 }
}

const nwBackStack=[];
let nwLastScreen=null,nwRestoring=false;
function nwScreenState(){return {tab,view,level,opened,sub,qi,wi};}
function nwScreenKey(st){return [st.tab,st.view,st.level,st.sub,st.qi].join('|');}
function nwTrackScreen(){
 const current=nwScreenState();
 if(!nwRestoring&&nwLastScreen&&nwScreenKey(current)!==nwScreenKey(nwLastScreen)){
   nwBackStack.push({...nwLastScreen});
   if(nwBackStack.length>120)nwBackStack.shift();
 }
 nwLastScreen=current;
}
function nwGoBack(){
 if(tab==='home'&&!view)return 'home';
 nwRestoring=true;
 let previous=nwBackStack.pop();
 if(!previous)previous={tab:'home',view:'',level:1,opened:1,sub:0,qi:0,wi};
 tab=previous.tab;view=previous.view;level=previous.level;opened=previous.opened;
 sub=previous.sub;qi=previous.qi;wi=previous.wi;
 nwLastScreen=nwScreenState();
 render();nwRestoring=false;
 window.scrollTo(0,0);animatePage();
 return 'back';
}
function nwAndroidBack(){return nwGoBack();}

">Level tidak ditemukan. Coba kata lain.</div>')}function quizResults(){let out=levels.slice(0,24).map((l,i)=>{let n=i+1;if(!smart(searchQuiz,`level ${n} ${l}`))return '';let p=nw24CountLevel(n)/1000*100;return `<button class="leveltile" onclick="${isLocked(n)?`lockInfo(${n})`:`startQuiz(${n})`}">${ico('book')}<b>${isLocked(n)?"🔒 ":""}Level ${n}</b><small>${nwTitleCaseId(l)}</small><div class="bar"><span style="width:${p}%"></span></div><span class="muted">${nw24CountLevel(n)}/1.000 soal · ${p.toFixed(1)}%</span></button>`}).join('');return suggestionMarkup(searchQuiz,levels.map((x,i)=>`level ${i+1} ${x}`).concat(levels),'quiz')+(out||'<div class="empty">Level tidak ditemukan. Coba kata lain.</div>')}function sampleWords(){const arr=words.map((x,i)=>({...x,i}));for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr.slice(0,3)}
function relevantResults(q,items,field){if(!q.trim())return '';const nq=normalize(q);let ranked=items.map(x=>{const label=String(x.label),nl=normalize(label);const terms=nl.split(' ');let score=nl.includes(nq)?0:Math.min(...terms.map(w=>distance(nq,w)));return {...x,score}}).filter(x=>x.score<=Math.max(2,Math.floor(nq.length/3))||normalize(x.label).includes(nq)).sort((a,b)=>a.score-b.score).slice(0,9);if(!ranked.length)return '<div class="empty">Belum ada hasil terkait dalam data demo.</div>';return `<div class="search-related"><b>Hasil yang mungkin dicari</b>${ranked.map(x=>`<button class="search-hit" onclick="${x.action}"><span class="tag">${x.type}</span><span>${safe(x.label)}</span> →</button>`).join('')}</div>`}

function nwMiniNormalizeArabic(raw){return String(raw??'').normalize('NFKC').replace(/[\u0640\u064b-\u065f\u0670\u06d6-\u06ed]/g,'').replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();}
function nwMiniNormalizeIndonesian(raw){return String(raw??'').toLocaleLowerCase('id-ID').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘`]/g,"'").replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();}
function nwMiniIsArabic(q){return /[\u0600-\u06ff]/.test(q);}
function nwMiniBuildIndex(entries){const seen=new Set(),out=[];for(const row of entries){if(!row||typeof row.ar!=='string'||typeof row.meaning!=='string'||!row.ar.trim()||!row.meaning.trim())continue;const ar=nwMiniNormalizeArabic(row.ar),meaning=nwMiniNormalizeIndonesian(row.meaning);const key=typeof row.id==='string'&&row.id.trim()?'id:'+row.id:'lex:'+ar+'|'+meaning;if(seen.has(key))continue;seen.add(key);const aliases=Array.isArray(row.aliases)?row.aliases.filter(x=>typeof x==='string').map(nwMiniNormalizeIndonesian):[];const formsAr=Array.isArray(row.forms_ar)?row.forms_ar.filter(x=>typeof x==='string').map(nwMiniNormalizeArabic):[];out.push({item:row,ar,meaning,aliases,formsAr,words:(meaning+' '+aliases.join(' ')).split(' ').filter(Boolean)});}return out;}

 };

function nwMiniRank(entry,q,isArabic){const candidates=isArabic?[entry.ar,...entry.formsAr]:[entry.meaning,...entry.aliases];const articleVariant=isArabic&&q.startsWith('ال')&&q.length>=5?q.slice(2):'';if(candidates.some(t=>t===q||(articleVariant&&t===articleVariant)))return 0;if(candidates.some(t=>t.startsWith(q)||(articleVariant&&t.startsWith(articleVariant))))return 1;if(!isArabic&&entry.words.some(w=>w.startsWith(q)))return 2;if(candidates.some(t=>t.includes(q)||(articleVariant&&t.includes(articleVariant))))return 3;if(q.length>=4){const pool=isArabic?candidates:entry.words;let best=99;for(const token of pool){if(Math.abs(token.length-q.length)>2)continue;const d=distance(q,token);if(d<best)best=d;}if(best<=1||(q.length>=7&&best<=2))return 4;}return -1;}
function nwMiniFind(query){const q=isArabicQuery(query)?nwMiniNormalizeArabic(query):nwMiniNormalizeIndonesian(query);if(!q)return {rows:nwMiniIndex,total:nwMiniIndex.length};const arabic=isArabicQuery(query),found=[];for(const row of nwMiniIndex){let rank=nwMiniRank(row,q,arabic);if(rank>=0)found.push({row,rank});}found.sort((a,b)=>a.rank-b.rank||a.row.ar.localeCompare(b.row.ar,'ar'));return {rows:found.map(x=>x.row),total:found.length};}

function fitNahwooHome(){

 document.body.classList.toggle('home-one-screen',active);
 const screen=document.getElementById('screen');
 if(!screen)return;
 // Reset all previous sizing BEFORE measuring, including after tab changes.
 screen.style.transform='';
 screen.style.zoom='1';
 screen.style.width='100%';
 if(!active)return;
 const nav=document.getElementById('nav');
 const header=document.querySelector('.app header');
 if(!nav||!header)return;
 nwHomeLockFrame();
 const available=Math.max(1,nav.getBoundingClientRect().top-header.getBoundingClientRect().bottom);
 const needed=Math.max(1,screen.scrollHeight);
 const ratio=Math.max(.35,Math.min(1,available/needed));
 // CSS zoom scales layout and hit targets together. Unlike transform:scale,
 // it cannot collide with the page-enter animation's own transform.
 // Compensate the layout width so the final painted width remains exact.
 screen.style.width=(100/ratio)+'%';
 screen.style.zoom=String(ratio);
}

const NW_ID_TITLE_PARTICLES=new Set([
 'di','ke','dari','dan','yang','untuk','atau','pada','dalam','dengan','sebagai',
 'antara','terhadap','kepada','oleh','tentang','bagi','demi','tanpa','melalui',

]);
function nwTitleCaseId(value){
 const text=String(value??'');
 let n=0;
 return text.replace(/[\p{L}\p{M}]+(?:['’‘][\p{L}\p{M}]+)*/gu,word=>{
   const isFirst=n++===0,lower=word.toLocaleLowerCase('id-ID');
   if(!isFirst&&NW_ID_TITLE_PARTICLES.has(lower))return lower;
   // Preserve uppercase acronyms and existing proper-name internal capitalization.
   if(word.length>1&&word===word.toUpperCase()&&word!==word.toLowerCase())return word;
   return word.slice(0,1).toLocaleUpperCase('id-ID')+word.slice(1);
 });
}

function nwRenderArabicEscaped(v){
 const rx=/([\p{Script=Arabic}\p{Mark}]+(?:[ \t]+[\p{Script=Arabic}\p{Mark}]+)*)/gu;
 let result='',start=0;
 for(const m of v.matchAll(rx)){
   result+=nwEscape(v.slice(start,m.index));
   result+=`<span class="nw-arab-inline" lang="ar" dir="rtl">${nwEscape(m[0])}</span>`;
   start=m.index+m[0].length;
 }
 return result+nwEscape(v.slice(start));
}
/* Note N-016: Markdown formatting must be resolved across rich-text run boundaries.
 * Do not simply regex-replace individual segments: **bold** can start in one

function nwRenderRichText(segs){

 const styled=new Uint8Array(plain.length),removed=new Uint8Array(plain.length);
 for(const m of plain.matchAll(/\*\*([\s\S]+?)\*\*/g)){
   const st=m.index,ed=st+m[0].length;
   for(let i=st;i<st+2;i++)removed[i]=1;
   for(let i=ed-2;i<ed;i++)removed[i]=1;
   for(let i=st+2;i<ed-2;i++)styled[i]|=1;
 }
 const italicScan=plain.split('').map((c,i)=>removed[i]?' ':c).join('');
 for(const m of italicScan.matchAll(/\*([^*\n]+?)\*/g)){
   const st=m.index,ed=st+m[0].length;
   if((st>0&&plain[st-1]==='*')||(ed<plain.length&&plain[ed]==='*')||removed[st]||removed[ed-1])continue;
   removed[st]=removed[ed-1]=1;
   for(let i=st+1;i<ed-1;i++)styled[i]|=2;

 // Malformed unmatched ** is an authoring error. Hide delimiter noise from readers,
 // but flag it through build-time QA rather than silently editing source data.
 for(let i=0;i<plain.length-1;i++){
   if(!removed[i]&&!removed[i+1]&&plain[i]==='*'&&plain[i+1]==='*'){

 }

 function flush(){
   if(!buffer)return;
   let html=nwRenderArabicEscaped(buffer);
   if(lastStyle&2)html=`<em>${html}</em>`;
   if(lastStyle&1)html=`<strong>${html}</strong>`;

 }

function nwV4QuickCheckMarkup(blocks){

function nwSemanticSectionMarkup(section,index,isV4,n){

 if(kind==='flow')return '<section class="nwx-flow">'+heading+blocks.map(nwBlockMarkup).join('')+'</section>';
 if(!blocks.length)return '<section class="nwx-flow">'+heading+'</section>';
 // Only sections with explicit semantic intent become colored cards.
 if(kind==='target'){

 }else content=blocks.map(nwBlockMarkup).join('');

 out+=`<div class="nw-eval-question"><div class="nw-eval-meta" id="nw-eval-active-number">SOAL ${nwEvalIndex+1} DARI 20 · ${nwEscape(q.skill_tag||'Pemahaman')} · ${nwEscape(q.difficulty||'')}</div>${nwEvalArabic(q)}<h3>${nwSegments(q.stem)}</h3><div class="nw-eval-opts">${nwEvalButtons(q)}</div><div class="nw-guided-hints"><div class="nw-guided-head">💡 Butuh bantuan? <small>Opsional, tanpa pengurangan nilai</small></div>${openedHints<1?'<button class="nw-hint-btn" onclick="nwEvalHint(1)">Buka Petunjuk 1 · Cara berpikir</button>':`<div class="nw-hint-text"><b>Petunjuk 1 · Cara berpikir</b><p>${nwTextMixed(q.hint1)}</p></div>${openedHints<2?'<button class="nw-hint-btn" onclick="nwEvalHint(2)">Masih bingung? Buka Petunjuk 2</button>':`<div class="nw-hint-text"><b>Petunjuk 2 · Kosakata atau contoh bantu</b><p>${nwTextMixed(q.hint2)}</p></div>`}`}</div></div>`;
 out+=`<div class="nw-eval-nav"><button class="nw-eval-btn nw-eval-outline" ${nwEvalIndex===0?'disabled':''} onclick="nwEvalGo(${nwEvalIndex-1})">← Sebelumnya</button><button class="nw-eval-btn" ${nwEvalIndex===19?'disabled':''} onclick="nwEvalGo(${nwEvalIndex+1})">Berikutnya →</button></div>`;
 if(answered===20)out+=nwEvalConfirm?'<div class="nw-eval-confirm"><b>Kirim 20 jawaban sekarang?</b><p>Setelah dikirim, jawaban tidak bisa diubah. Nilai, kunci, dan pembahasan akan dibuka.</p><button class="nw-eval-btn nw-eval-outline" onclick="nwEvalConfirm=false;nwEvalDraw()">Periksa lagi</button> <button class="nw-eval-btn" onclick="nwEvalSubmit()">Ya, kirim</button></div>':'<button class="nw-eval-btn nw-eval-submit" onclick="nwEvalConfirm=true;nwEvalDraw()">Kirim 20 Jawaban</button>';
 else out+=`<p class="nw-eval-note">Masih ada ${20-answered} soal. Lengkapi semuanya untuk membuka tombol kirim. Pilihan tersimpan otomatis.</p>`;
 root.innerHTML=out;
}
function nwEvalArabic(q){const lines=(q.arabic_lines||[]).filter(Boolean);const words=(q.focus_words||[]).filter(Boolean);if(!lines.length&&!words.length)return '';return `<div class="nw-eval-arab-wrap">${lines.length?`<div class="nw-eval-arab-lines" lang="ar" dir="rtl">${lines.map(line=>`<div>${nwEscape(line)}</div>`).join('')}</div>`:''}${words.length?`<div class="nw-eval-focus" lang="ar" dir="rtl">${words.map(w=>`<span>${nwEscape(w)}</span>`).join('')}</div>`:''}</div>`;}
function nwEvalMarkup(){return '<section class="nw-eval" id="nw-eval-root"><p>Menyiapkan 20 soal evaluasi…</p></section>';}

/* Load mufradat on startup; a resumed WebView catches up after screen lock. */
nwMiniEnsureLoaded();
window.setInterval(nwHomeTick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)nwHomeTick()});
window.addEventListener('focus',nwHomeTick);
</script></body></html>
